    <script>
        /* ========================================================
           1. 平板 / 手机 / 鼠标 3D 视角控制器
           ======================================================== */
        let controlsEnabled = true;

        class TabletDualTouchControls {
            constructor(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;

                this.target = new THREE.Vector3(0, -0.6, 0);
                this.minDistance = 4.0;
                this.maxDistance = 22.0;

                const offset = new THREE.Vector3().subVectors(this.camera.position, this.target);
                this.radius = offset.length();
                this.theta = Math.atan2(offset.x, offset.z);
                this.phi = Math.acos(Math.max(-1, Math.min(1, offset.y / this.radius)));

                this.targetRadius = this.radius;
                this.targetTheta = this.theta;
                this.targetPhi = this.phi;

                this.isMouseDown = false;
                this.lastX = 0;
                this.lastY = 0;
                this.lastPinchDist = 0;

                this.initListeners();
            }

            initListeners() {
                window.addEventListener('contextmenu', e => e.preventDefault(), { passive: false });

                window.addEventListener('touchstart', (e) => {
                    if (!controlsEnabled || e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;

                    if (e.touches.length === 1) {
                        this.lastX = e.touches[0].clientX;
                        this.lastY = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        this.lastPinchDist = Math.hypot(dx, dy);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (!controlsEnabled || e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;

                    if (e.touches.length === 1) {
                        const curX = e.touches[0].clientX;
                        const curY = e.touches[0].clientY;
                        const dx = curX - this.lastX;
                        const dy = curY - this.lastY;
                        this.lastX = curX;
                        this.lastY = curY;

                        this.targetTheta -= dx * 0.0055;
                        this.targetPhi -= dy * 0.0055;
                        this.targetPhi = Math.max(0.08, Math.min(Math.PI - 0.08, this.targetPhi));
                    } else if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const dist = Math.hypot(dx, dy);
                        const pinchDelta = dist - this.lastPinchDist;
                        this.lastPinchDist = dist;

                        this.targetRadius -= pinchDelta * 0.025;
                        this.targetRadius = Math.max(this.minDistance, Math.min(this.maxDistance, this.targetRadius));
                    }
                }, { passive: false });

                window.addEventListener('mousedown', (e) => {
                    if (!controlsEnabled || e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;
                    this.isMouseDown = true;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!this.isMouseDown || !controlsEnabled) return;
                    const dx = e.clientX - this.lastX;
                    const dy = e.clientY - this.lastY;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;

                    this.targetTheta -= dx * 0.0055;
                    this.targetPhi -= dy * 0.0055;
                    this.targetPhi = Math.max(0.08, Math.min(Math.PI - 0.08, this.targetPhi));
                });

                window.addEventListener('mouseup', () => { this.isMouseDown = false; });

                window.addEventListener('wheel', (e) => {
                    if (e.target.closest('#modal-wrapper') || !controlsEnabled) return;
                    this.targetRadius += e.deltaY * 0.008;
                    this.targetRadius = Math.max(this.minDistance, Math.min(this.maxDistance, this.targetRadius));
                }, { passive: true });
            }

            update() {
                this.radius += (this.targetRadius - this.radius) * 0.1;
                this.theta += (this.targetTheta - this.theta) * 0.1;
                this.phi += (this.targetPhi - this.phi) * 0.1;

                const sinPhi = Math.sin(this.phi);
                this.camera.position.x = this.target.x + this.radius * sinPhi * Math.sin(this.theta);
                this.camera.position.y = this.target.y + this.radius * Math.cos(this.phi);
                this.camera.position.z = this.target.z + this.radius * sinPhi * Math.cos(this.theta);
                this.camera.lookAt(this.target);
            }
        }

        /* ========================================================
           2. 课本材质与防眩光柔和处理
           ======================================================== */
        function createBookPagesTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 512;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = "#d8caa4"; ctx.fillRect(0, 0, 128, 512);
            for (let y = 0; y < 512; y += 2) {
                const alpha = (Math.sin(y * 0.9) * 0.15 + 0.25) + Math.random() * 0.12;
                ctx.strokeStyle = `rgba(130, 110, 85, ${alpha})`; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(128, y); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(12, 1);
            return tex;
        }

        function createEndPaperTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 1440;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#eddcc6"; ctx.fillRect(0, 0, 1024, 1440);
            ctx.strokeStyle = "#dec7ab"; ctx.lineWidth = 8;
            ctx.strokeRect(40, 40, 944, 1360);
            ctx.fillStyle = "#7b5b3a"; ctx.font = "bold 34px 'KaiTi', serif"; ctx.textAlign = "center";
            ctx.fillText("普通高中教科书 · 数学", 512, 680);
            ctx.font = "24px 'KaiTi', serif"; ctx.fillStyle = "#a88a68";
            ctx.fillText("人民教育出版社 课程教材研究所", 512, 740);
            const tex = new THREE.CanvasTexture(canvas);
            tex.generateMipmaps = true;
            return tex;
        }

        function createInstantCoverTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 1440;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 1024, 1440);
            grad.addColorStop(0, '#f2ece2'); grad.addColorStop(0.6, '#f6eee5'); grad.addColorStop(1, '#e8ded0');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 1440);
            ctx.fillStyle = "#2d5a43"; ctx.fillRect(0, 0, 1024, 220);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 38px 'KaiTi', serif"; ctx.fillText("普通高中教科书", 100, 95);
            ctx.fillStyle = "#dfa143"; ctx.fillRect(100, 120, 220, 50);
            ctx.fillStyle = "#1e3a2b"; ctx.font = "bold 30px 'KaiTi', serif"; ctx.fillText("必 修  第二册", 115, 156);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 30px 'KaiTi', serif"; ctx.fillText("A 版", 340, 156);
            ctx.fillStyle = "#1b2c22"; ctx.font = "bold 160px 'KaiTi', serif"; ctx.fillText("数", 100, 520); ctx.fillText("学", 340, 520);
            ctx.fillStyle = "#263d30"; ctx.font = "bold 40px 'KaiTi', serif"; ctx.fillText("人民教育出版社", 100, 1370);
            const tex = new THREE.CanvasTexture(canvas);
            tex.generateMipmaps = true;
            return tex;
        }

        function processNoteImageToPaper(img, targetMaterial) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2880;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#f5efe6";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#dfd3c0"; ctx.lineWidth = 12;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

            ctx.save();
            ctx.globalCompositeOperation = 'multiply';
            ctx.drawImage(img, 30, 30, canvas.width - 60, canvas.height - 60);
            ctx.restore();

            const tex = new THREE.CanvasTexture(canvas);
            tex.generateMipmaps = true;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            targetMaterial.map = tex;
            targetMaterial.needsUpdate = true;
        }

            return new THREE.CanvasTexture(canvas);
        }

            if (isFullscreenAnimating) return;

            if (!isGraphFullscreen) {
                // ---- 步骤 A: 展开全屏 ----

                plane2dBody.insertBefore(fsPlaceholder, p2dCanvasBox);

                p2dCanvasBox.style.position = 'fixed';
                p2dCanvasBox.style.zIndex = '120';
                p2dCanvasBox.style.margin = '0';
                p2dCanvasBox.style.top = startRect.top + 'px';
                p2dCanvasBox.style.left = startRect.left + 'px';
                p2dCanvasBox.style.width = startRect.width + 'px';
                p2dCanvasBox.style.height = startRect.height + 'px';

                plane2dHeader.classList.add('fs-header-active');

                gsap.to(p2dCanvasBox, {
                    top: headerHeight,
                    left: 0,
                    width: window.innerWidth,
                    height: window.innerHeight - headerHeight,
                    borderRadius: 0,

                    },
                    onComplete: () => {
                        isGraphFullscreen = true;

                        resizeCanvases();
                        update2DCanvas();
                    }
                });

            } else {
                // ---- 步骤 B: 顺滑收束退出全屏 ----
                const targetRect = fsPlaceholder ? fsPlaceholder.getBoundingClientRect() : {
                    top: window.innerHeight * 0.1,

                        p2dCanvasBox.style.left = '';
                        p2dCanvasBox.style.width = '';
                        p2dCanvasBox.style.height = '';

                        if (fsPlaceholder && fsPlaceholder.parentNode) {

                            fsPlaceholder = null;
                        }
                        isGraphFullscreen = false;
                        isFullscreenAnimating = false;
                        resizeCanvases();
                        update2DCanvas();
                    }
                });
            }

        function drawCanvasLine(ctx, x1, y1, x2, y2, isDash = false, color = "#261d15", width = 2) {
            ctx.save(); ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width;
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            if (isDash) ctx.setLineDash([7, 5]);
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
        }

        function drawCanvasText(ctx, text, x, y, color = "#261d15", font = "bold 15px 'KaiTi'") {
            ctx.save(); ctx.font = font; ctx.fillStyle = color; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, x, y); ctx.restore();
        }

        function update2DCanvas() {
            if (!isPlaneActive) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
            const w = p2dCanvas.width / dpr;
            const h = p2dCanvas.height / dpr;

            p2dCtx.clearRect(0, 0, w, h);

            p2dCtx.save();
            p2dCtx.strokeStyle = "#f3f4f6";
            p2dCtx.lineWidth = 1;
            for (let x = 0; x < w; x += 32) { p2dCtx.beginPath(); p2dCtx.moveTo(x, 0); p2dCtx.lineTo(x, h); p2dCtx.stroke(); }
            for (let y = 0; y < h; y += 32) { p2dCtx.beginPath(); p2dCtx.moveTo(0, y); p2dCtx.lineTo(w, y); p2dCtx.stroke(); }
            p2dCtx.restore();

            const cx = w * 0.44, cy = h * 0.5;

            p2dCtx.strokeStyle = "#94a3b8"; p2dCtx.lineWidth = 1.6;
            drawCanvasLine(p2dCtx, 20, cy, w - 20, cy);
            drawCanvasLine(p2dCtx, cx, 20, cx, h - 20);
            drawCanvasText(p2dCtx, "O", cx - 14, cy + 15, "#64748b", "bold 15px 'KaiTi'");
            drawCanvasText(p2dCtx, "x", w - 14, cy + 15, "#64748b", "bold 15px sans-serif");
            drawCanvasText(p2dCtx, "y", cx + 15, 16, "#64748b", "bold 15px sans-serif");

            if (currentActivePlaneKey && currentActivePlaneKey.startsWith('el-')) {
                const a = Math.min(w, h) * 0.33;
                const e = paramEllipseE;
                const c = a * e;
                const b = Math.sqrt(Math.max(1, a * a - c * c));
                const directrixX = a / e;

                p2dCtx.save();
                p2dCtx.beginPath();
                p2dCtx.strokeStyle = "#0284c7";
                p2dCtx.lineWidth = 3.2;
                p2dCtx.ellipse(cx, cy, a, b, 0, 0, Math.PI * 2);
                p2dCtx.stroke();
                p2dCtx.restore();

                drawCanvasLine(p2dCtx, cx + directrixX, 25, cx + directrixX, h - 25, true, "#d97706", 2.2);
                drawCanvasText(p2dCtx, `准线 x = a/e`, cx + directrixX, 16, "#d97706", "bold 14px 'KaiTi'");

                p2dCtx.fillStyle = "#dc2626";
                p2dCtx.beginPath(); p2dCtx.arc(cx + c, cy, 5.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "F(c,0)", cx + c, cy + 18, "#dc2626", "bold 15px 'KaiTi'");

                const px = cx + a * Math.cos(dynamicTheta);
                const py = cy - b * Math.sin(dynamicTheta);
                const mx = cx + directrixX;
                const my = py;

                drawCanvasLine(p2dCtx, px, py, cx + c, cy, false, "#dc2626", 2.6);
                drawCanvasLine(p2dCtx, px, py, mx, my, true, "#059669", 2.6);

                p2dCtx.fillStyle = "#059669";
                p2dCtx.beginPath(); p2dCtx.arc(mx, my, 4.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "M", mx + 14, my, "#059669", "bold 15px 'KaiTi'");

                p2dCtx.fillStyle = "#2563eb";
                p2dCtx.beginPath(); p2dCtx.arc(px, py, 8, 0, Math.PI * 2); p2dCtx.fill();
                p2dCtx.strokeStyle = "#ffffff"; p2dCtx.lineWidth = 2.5; p2dCtx.stroke();
                drawCanvasText(p2dCtx, "P", px, py - 18, "#1e3a8a", "bold 15px 'KaiTi'");

                const distPF = Math.hypot(px - (cx + c), py - cy);
                const distPM = Math.abs(mx - px);
                const ratio = distPF / distPM;

                p2dCtx.fillStyle = "rgba(255,255,255,0.94)";
                p2dCtx.fillRect(25, 25, 185, 70);
                p2dCtx.strokeStyle = "#cbd5e1"; p2dCtx.strokeRect(25, 25, 185, 70);
                drawCanvasText(p2dCtx, `|PF| = ${distPF.toFixed(1)}`, 115, 42, "#dc2626", "bold 14px monospace");
                drawCanvasText(p2dCtx, `|PM| = ${distPM.toFixed(1)}`, 115, 62, "#059669", "bold 14px monospace");
                drawCanvasText(p2dCtx, `比值 e ≡ ${(ratio).toFixed(2)}`, 115, 82, "#0284c7", "bold 15px monospace");

            } else {
                const p = paramParabolaP * 28;
                let dir = 'right';
                if (currentActivePlaneKey === 'pa-left') dir = 'left';
                else if (currentActivePlaneKey === 'pa-up') dir = 'up';
                else if (currentActivePlaneKey === 'pa-down') dir = 'down';

                p2dCtx.save();
                p2dCtx.strokeStyle = "#0284c7";
                p2dCtx.lineWidth = 3.2;
                p2dCtx.beginPath();
                const span = 170;
                for (let t = -span; t <= span; t += 3) {
                    let rx = 0, ry = 0;
                    if (dir === 'right') { rx = cx + (t*t)/(2*p); ry = cy + t; }
                    else if (dir === 'left') { rx = cx - (t*t)/(2*p); ry = cy + t; }
                    else if (dir === 'up') { rx = cx + t; ry = cy - (t*t)/(2*p); }
                    else { rx = cx + t; ry = cy + (t*t)/(2*p); }
                    if (t === -span) p2dCtx.moveTo(rx, ry); else p2dCtx.lineTo(rx, ry);
                }
                p2dCtx.stroke();
                p2dCtx.restore();

                let fx = cx, fy = cy, lx1 = 0, ly1 = 0, lx2 = 0, ly2 = 0;
                if (dir === 'right') {
                    fx = cx + p/2; fy = cy;
                    lx1 = cx - p/2; ly1 = 25; lx2 = cx - p/2; ly2 = h - 25;
                } else if (dir === 'left') {
                    fx = cx - p/2; fy = cy;
                    lx1 = cx + p/2; ly1 = 25; lx2 = cx + p/2; ly2 = h - 25;
                } else if (dir === 'up') {
                    fx = cx; fy = cy - p/2;
                    lx1 = 25; ly1 = cy + p/2; lx2 = w - 25; ly2 = cy + p/2;
                } else {
                    fx = cx; fy = cy + p/2;
                    lx1 = 25; ly1 = cy - p/2; lx2 = w - 25; ly2 = cy - p/2;
                }

                drawCanvasLine(p2dCtx, lx1, ly1, lx2, ly2, true, "#d97706", 2.2);
                drawCanvasText(p2dCtx, "准线 l", dir === 'up' || dir === 'down' ? w - 25 : lx1, dir === 'up' || dir === 'down' ? ly1 - 14 : 16, "#d97706", "bold 14px 'KaiTi'");

                p2dCtx.fillStyle = "#dc2626"; p2dCtx.beginPath(); p2dCtx.arc(fx, fy, 5.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "F", fx + 14, fy + 14, "#dc2626", "bold 15px 'KaiTi'");

                const tVal = dynamicParabolaT;
                let px = 0, py = 0, mx = 0, my = 0;
                if (dir === 'right') {
                    px = cx + (tVal*tVal)/(2*p); py = cy + tVal;
                    mx = cx - p/2; my = py;
                } else if (dir === 'left') {
                    px = cx - (tVal*tVal)/(2*p); py = cy + tVal;
                    mx = cx + p/2; my = py;
                } else if (dir === 'up') {
                    px = cx + tVal; py = cy - (tVal*tVal)/(2*p);
                    mx = px; my = cy + p/2;
                } else {
                    px = cx + tVal; py = cy + (tVal*tVal)/(2*p);
                    mx = px; my = cy - p/2;
                }

                drawCanvasLine(p2dCtx, px, py, fx, fy, false, "#dc2626", 2.6);
                drawCanvasLine(p2dCtx, px, py, mx, my, true, "#059669", 2.6);

                p2dCtx.fillStyle = "#059669"; p2dCtx.beginPath(); p2dCtx.arc(mx, my, 4.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "M", mx + 14, my - 8, "#059669", "bold 14px 'KaiTi'");

                p2dCtx.fillStyle = "#2563eb"; p2dCtx.beginPath(); p2dCtx.arc(px, py, 8, 0, Math.PI * 2); p2dCtx.fill();
                p2dCtx.strokeStyle = "#ffffff"; p2dCtx.lineWidth = 2.5; p2dCtx.stroke();
                drawCanvasText(p2dCtx, "P", px + 16, py - 16, "#1e3a8a", "bold 15px 'KaiTi'");

                const d1 = Math.hypot(px - fx, py - fy);
                const d2 = Math.hypot(px - mx, py - my);
                p2dCtx.fillStyle = "rgba(255,255,255,0.94)"; p2dCtx.fillRect(25, 25, 185, 65);
                p2dCtx.strokeStyle = "#cbd5e1"; p2dCtx.strokeRect(25, 25, 185, 65);
                drawCanvasText(p2dCtx, `|PF| = ${d1.toFixed(1)}`, 115, 45, "#dc2626", "bold 14px monospace");
                drawCanvasText(p2dCtx, `|PM| = ${d2.toFixed(1)}`, 115, 68, "#059669", "bold 14px monospace");
            }
        }

        /* ========================================================
           ⭐ 7. 图像批注图层与动点跟手算法 (全屏模式 100% 贴合)
           ======================================================== */
        let graphTool = 'drag';
        let graphColor = '#dc2626';
        let isGraphDrawing = false;
        let graphStartX = 0, graphStartY = 0;
        let graphSnapshot = null;

        function getExactPos(canvas, e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function handlePointerTrack(e) {
            const rect = canvasInteractiveArea.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
            const w = p2dCanvas.width / dpr;
            const h = p2dCanvas.height / dpr;

            const mouseCanvasX = (e.clientX - rect.left);
            const mouseCanvasY = (e.clientY - rect.top);

            const cx = w * 0.44;
            const cy = h * 0.5;

            const dx = mouseCanvasX - cx;
            const dy = mouseCanvasY - cy;

            if (currentActivePlaneKey && currentActivePlaneKey.startsWith('el-')) {
                dynamicTheta = Math.atan2(-dy, dx);
            } else {
                let dir = 'right';
                if (currentActivePlaneKey === 'pa-left') dir = 'left';
                else if (currentActivePlaneKey === 'pa-up') dir = 'up';
                else if (currentActivePlaneKey === 'pa-down') dir = 'down';

                if (dir === 'right' || dir === 'left') {
                    dynamicParabolaT = Math.max(-140, Math.min(140, dy));
                } else {
                    dynamicParabolaT = Math.max(-140, Math.min(140, dx));
                }
            }
        }

        graphDrawCanvas.addEventListener('pointerdown', (e) => {
            const pos = getExactPos(graphDrawCanvas, e);
            if (graphTool === 'drag') {
                isDraggingPoint = true;
                try { graphDrawCanvas.setPointerCapture(e.pointerId); } catch(err){}
                handlePointerTrack(e);
            } else {
                isGraphDrawing = true;
                try { graphDrawCanvas.setPointerCapture(e.pointerId); } catch(err){}
                graphStartX = pos.x;
                graphStartY = pos.y;

                if (graphTool === 'line') {
                    graphSnapshot = graphDrawCtx.getImageData(0, 0, graphDrawCanvas.width, graphDrawCanvas.height);
                } else if (graphTool === 'pen') {
                    graphDrawCtx.beginPath();
                    graphDrawCtx.moveTo(pos.x, pos.y);
                }
            }
            e.preventDefault();
        });

        window.addEventListener('pointermove', (e) => {
            if (!isPlaneActive) return;

            if (isDraggingPoint && graphTool === 'drag') {
                handlePointerTrack(e);
            } else if (isGraphDrawing && graphTool !== 'drag') {
                const pos = getExactPos(graphDrawCanvas, e);

                if (graphTool === 'pen') {
                    graphDrawCtx.save();
                    graphDrawCtx.strokeStyle = graphColor;
                    graphDrawCtx.lineWidth = 2.6;
                    graphDrawCtx.lineCap = 'round';
                    graphDrawCtx.lineJoin = 'round';
                    graphDrawCtx.lineTo(pos.x, pos.y);
                    graphDrawCtx.stroke();
                    graphDrawCtx.restore();
                } else if (graphTool === 'eraser') {
                    graphDrawCtx.save();
                    graphDrawCtx.globalCompositeOperation = 'destination-out';
                    graphDrawCtx.beginPath();
                    graphDrawCtx.arc(pos.x, pos.y, 14, 0, Math.PI * 2);
                    graphDrawCtx.fill();
                    graphDrawCtx.restore();
                } else if (graphTool === 'line') {
                    if (graphSnapshot) graphDrawCtx.putImageData(graphSnapshot, 0, 0);
                    graphDrawCtx.save();
                    graphDrawCtx.strokeStyle = graphColor;
                    graphDrawCtx.lineWidth = 2.6;
                    graphDrawCtx.lineCap = 'round';
                    graphDrawCtx.beginPath();
                    graphDrawCtx.moveTo(graphStartX, graphStartY);
                    graphDrawCtx.lineTo(pos.x, pos.y);
                    graphDrawCtx.stroke();
                    graphDrawCtx.restore();
                }
            }
        });

        window.addEventListener('pointerup', (e) => {
            isDraggingPoint = false;
            isGraphDrawing = false;
            graphSnapshot = null;
            try { graphDrawCanvas.releasePointerCapture(e.pointerId); } catch(err){}
        });

        const btnGDrag = document.getElementById('btn-graph-drag');
        const btnGPen = document.getElementById('btn-graph-pen');
        const btnGLine = document.getElementById('btn-graph-line');
        const btnGEraser = document.getElementById('btn-graph-eraser');
        const btnGClear = document.getElementById('btn-graph-clear');

        function setGraphTool(tool, btn) {
            graphTool = tool;
            [btnGDrag, btnGPen, btnGLine, btnGEraser].forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (tool === 'drag') graphDrawCanvas.style.cursor = 'grab';
            else graphDrawCanvas.style.cursor = 'crosshair';
        }

        btnGDrag.onclick = () => setGraphTool('drag', btnGDrag);
        btnGPen.onclick = () => setGraphTool('pen', btnGPen);
        btnGLine.onclick = () => setGraphTool('line', btnGLine);
        btnGEraser.onclick = () => setGraphTool('eraser', btnGEraser);

        btnGClear.onclick = () => {
            const rect = canvasInteractiveArea.getBoundingClientRect();
            graphDrawCtx.clearRect(0, 0, rect.width, rect.height);
        };

        document.querySelectorAll('.g-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.g-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                graphColor = dot.getAttribute('data-color');
                if (graphTool === 'eraser' || graphTool === 'drag') setGraphTool('pen', btnGPen);
            };
        });

        /* ========================================================
           ⭐ 8. 精简收窄版右侧草稿纸
           ======================================================== */
        const sketchCanvasWrap = document.getElementById('sketch-canvas-wrap');
        const sketchCanvas = document.getElementById('sketch-canvas');
        const sketchCtx = sketchCanvas.getContext('2d');

        let sketchTool = 'pen';
        let sketchColor = '#1e293b';
        let isDrawingSketch = false;
        let sketchStartX = 0, sketchStartY = 0;
        let sketchSnapshot = null;

        function resizeSketchCanvas() {
            const rect = sketchCanvasWrap.getBoundingClientRect();
            if (rect.width < 10 || rect.height < 10) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

            let tempCanvas = null;
            if (sketchCanvas.width > 0 && sketchCanvas.height > 0) {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = sketchCanvas.width;
                tempCanvas.height = sketchCanvas.height;
                tempCanvas.getContext('2d').drawImage(sketchCanvas, 0, 0);
            }

            sketchCanvas.width = Math.round(rect.width * dpr);
            sketchCanvas.height = Math.round(rect.height * dpr);
            sketchCtx.setTransform(1, 0, 0, 1, 0, 0);
            sketchCtx.scale(dpr, dpr);

            if (tempCanvas) {
                sketchCtx.drawImage(tempCanvas, 0, 0, rect.width, rect.height);
            }
        }

        sketchCanvas.addEventListener('pointerdown', (e) => {
            isDrawingSketch = true;
            try { sketchCanvas.setPointerCapture(e.pointerId); } catch(err){}
            const pos = getExactPos(sketchCanvas, e);
            sketchStartX = pos.x;
            sketchStartY = pos.y;

            if (sketchTool === 'line') {
                sketchSnapshot = sketchCtx.getImageData(0, 0, sketchCanvas.width, sketchCanvas.height);
            } else {
                sketchCtx.beginPath();
                sketchCtx.moveTo(pos.x, pos.y);
            }
            e.preventDefault();
        });

        sketchCanvas.addEventListener('pointermove', (e) => {
            if (!isDrawingSketch) return;
            const pos = getExactPos(sketchCanvas, e);

            if (sketchTool === 'pen') {
                sketchCtx.save();
                sketchCtx.strokeStyle = sketchColor;
                sketchCtx.lineWidth = 2.6;
                sketchCtx.lineCap = 'round';
                sketchCtx.lineJoin = 'round';
                sketchCtx.lineTo(pos.x, pos.y);
                sketchCtx.stroke();
                sketchCtx.restore();
            } else if (sketchTool === 'eraser') {
                sketchCtx.save();
                sketchCtx.clearRect(pos.x - 12, pos.y - 12, 24, 24);
                sketchCtx.restore();
            } else if (sketchTool === 'line') {
                if (sketchSnapshot) sketchCtx.putImageData(sketchSnapshot, 0, 0);
                sketchCtx.save();
                sketchCtx.strokeStyle = sketchColor;
                sketchCtx.lineWidth = 2.6;
                sketchCtx.lineCap = 'round';
                sketchCtx.beginPath();
                sketchCtx.moveTo(sketchStartX, sketchStartY);
                sketchCtx.lineTo(pos.x, pos.y);
                sketchCtx.stroke();
                sketchCtx.restore();
            }
        });

        sketchCanvas.addEventListener('pointerup', (e) => {
            if (!isDrawingSketch) return;
            isDrawingSketch = false;
            sketchSnapshot = null;
            try { sketchCanvas.releasePointerCapture(e.pointerId); } catch(err){}
        });

        const btnPen = document.getElementById('btn-tool-pen');
        const btnLine = document.getElementById('btn-tool-line');
        const btnEraser = document.getElementById('btn-tool-eraser');
        const btnClear = document.getElementById('btn-tool-clear');

        function setToolActive(tool, btn) {
            sketchTool = tool;
            [btnPen, btnLine, btnEraser].forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        btnPen.onclick = () => setToolActive('pen', btnPen);
        btnLine.onclick = () => setToolActive('line', btnLine);
        btnEraser.onclick = () => setToolActive('eraser', btnEraser);

        btnClear.onclick = () => {
            const rect = sketchCanvasWrap.getBoundingClientRect();
            sketchCtx.clearRect(0, 0, rect.width, rect.height);
        };

        document.querySelectorAll('.s-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.s-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                sketchColor = dot.getAttribute('data-color');
                if (sketchTool === 'eraser') setToolActive('pen', btnPen);
            };
        });

        /* ========================================================
           9. 课本点击与知识版块响应
           ======================================================== */
        function handlePointerTap(clientX, clientY) {
            if (isAnimating || isPlaneActive || isPlaneTransitioning) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (!isBookOpen) {
                const hits = raycaster.intersectObjects([bookCover, bookBase, coverPivot, ...bookGroup.children], true);
                if (hits.length > 0) openBook();
                return;
            }

            const hits = raycaster.intersectObjects([bookBase], true);
            if (hits.length > 0) {
                const hitPoint = hits[0].point.clone();
                const localPt = bookGroup.worldToLocal(hitPoint.clone());
                const x = localPt.x;
                const z = localPt.z;

                if (z < -0.1) {
                    if (z < -2.4) {
                        if (x < 0) riseUpPlaneCenter('el-def');
                        else riseUpPlaneCenter('el-graph');
                    } else {
                        if (x < 0) riseUpPlaneCenter('el-eq');
                        else riseUpPlaneCenter('el-verify');
                    }
                } else {
                    if (z < 1.6) {
                        riseUpPlaneCenter('pa-def');
                    } else {
                        if (x < -1.75) riseUpPlaneCenter('pa-right');
                        else if (x < 0) riseUpPlaneCenter('pa-left');
                        else if (x < 1.75) riseUpPlaneCenter('pa-up');
                        else riseUpPlaneCenter('pa-down');
                    }
                }
            }
        }

        let tapStartX = 0, tapStartY = 0, tapStartTime = 0;
        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;
            tapStartX = e.clientX;
            tapStartY = e.clientY;
            tapStartTime = Date.now();
        }, { passive: true });

        renderer.domElement.addEventListener('pointerup', (e) => {
            if (e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;
            const dist = Math.hypot(e.clientX - tapStartX, e.clientY - tapStartY);
            if (dist < 26 && (Date.now() - tapStartTime) < 500) {
                handlePointerTap(e.clientX, e.clientY);
            }
        }, { passive: true });

        /* ========================================================
           10. 渲染主循环与视口重置
           ======================================================== */
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            update2DCanvas();
        }
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (isPlaneActive) {
                if (isGraphFullscreen) {
                    p2dCanvasBox.style.width = window.innerWidth + 'px';
                    p2dCanvasBox.style.height = (window.innerHeight - 52) + 'px';
                }
                resizeCanvases();
            }
        };
    </script>
</body>
