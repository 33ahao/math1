    <script>
        /* ========================================================
           1. 3D 场景视角控制器
           ======================================================== */
        let controlsEnabled = true;

        class TabletDualTouchControls {
            constructor(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;

                this.target = new THREE.Vector3(0, -0.6, 0);
                this.minDistance = 4.0;
                this.maxDistance = 22.0;

                const offset = new THREE.Vector3().subVectors(this.camera.position, this.target);
                this.radius = offset.length();
                this.theta = Math.atan2(offset.x, offset.z);
                this.phi = Math.acos(Math.max(-1, Math.min(1, offset.y / this.radius)));

                this.targetRadius = this.radius;
                this.targetTheta = this.theta;
                this.targetPhi = this.phi;

                this.isMouseDown = false;
                this.lastX = 0;
                this.lastY = 0;
                this.lastPinchDist = 0;

                this.initListeners();
            }

            initListeners() {
                window.addEventListener('contextmenu', e => e.preventDefault(), { passive: false });

                window.addEventListener('touchstart', (e) => {
                    if (!controlsEnabled || e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;

                    if (e.touches.length === 1) {
                        this.lastX = e.touches[0].clientX;
                        this.lastY = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        this.lastPinchDist = Math.hypot(dx, dy);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (!controlsEnabled || e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;

                    if (e.touches.length === 1) {
                        const curX = e.touches[0].clientX;
                        const curY = e.touches[0].clientY;
                        const dx = curX - this.lastX;
                        const dy = curY - this.lastY;
                        this.lastX = curX;
                        this.lastY = curY;

                        this.targetTheta -= dx * 0.0055;
                        this.targetPhi -= dy * 0.0055;
                        this.targetPhi = Math.max(0.08, Math.min(Math.PI - 0.08, this.targetPhi));
                    } else if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const dist = Math.hypot(dx, dy);
                        const pinchDelta = dist - this.lastPinchDist;
                        this.lastPinchDist = dist;

                        this.targetRadius -= pinchDelta * 0.025;
                        this.targetRadius = Math.max(this.minDistance, Math.min(this.maxDistance, this.targetRadius));
                    }
                }, { passive: false });

                window.addEventListener('mousedown', (e) => {
                    if (!controlsEnabled || e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;
                    this.isMouseDown = true;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!this.isMouseDown || !controlsEnabled) return;
                    const dx = e.clientX - this.lastX;
                    const dy = e.clientY - this.lastY;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;

                    this.targetTheta -= dx * 0.0055;
                    this.targetPhi -= dy * 0.0055;
                    this.targetPhi = Math.max(0.08, Math.min(Math.PI - 0.08, this.targetPhi));
                });

                window.addEventListener('mouseup', () => { this.isMouseDown = false; });

                window.addEventListener('wheel', (e) => {
                    if (e.target.closest('#modal-wrapper') || !controlsEnabled) return;
                    this.targetRadius += e.deltaY * 0.008;
                    this.targetRadius = Math.max(this.minDistance, Math.min(this.maxDistance, this.targetRadius));
                }, { passive: true });
            }

            update() {
                this.radius += (this.targetRadius - this.radius) * 0.1;
                this.theta += (this.targetTheta - this.theta) * 0.1;
                this.phi += (this.targetPhi - this.phi) * 0.1;

                const sinPhi = Math.sin(this.phi);
                this.camera.position.x = this.target.x + this.radius * sinPhi * Math.sin(this.theta);
                this.camera.position.y = this.target.y + this.radius * Math.cos(this.phi);
                this.camera.position.z = this.target.z + this.radius * sinPhi * Math.cos(this.theta);
                this.camera.lookAt(this.target);
            }
        }

        /* ========================================================
           2. 课本材质：封面、双曲线、椭圆抛物线、例题研讨页
           ======================================================== */
        function createBookPagesTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 512;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = "#d8caa4"; ctx.fillRect(0, 0, 128, 512);
            for (let y = 0; y < 512; y += 2) {
                const alpha = (Math.sin(y * 0.9) * 0.15 + 0.25) + Math.random() * 0.12;
                ctx.strokeStyle = `rgba(130, 110, 85, ${alpha})`; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(128, y); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(12, 1);
            return tex;
        }

        function createLeftPageHyperbolaTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1440;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#f5efe6";
            ctx.fillRect(0, 0, 1024, 1440);
            ctx.strokeStyle = "#ded1be";
            ctx.lineWidth = 10;
            ctx.strokeRect(25, 25, 974, 1390);

            ctx.fillStyle = "#332314";
            ctx.font = "bold 32px serif";
            ctx.textAlign = "center";
            ctx.fillText("x²/a² - y²/b² = 1 ,  a, b > 0 ,  c² = a² + b² ,  e = c/a", 512, 70);

            ctx.strokeStyle = "#beab95";
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(50, 95); ctx.lineTo(974, 95); ctx.stroke();

            ctx.fillStyle = "#b43d0e";
            ctx.beginPath(); ctx.arc(80, 140, 22, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 26px 'KaiTi'";
            ctx.fillText("1", 80, 148);

            ctx.fillStyle = "#8a2408";
            ctx.font = "bold 36px 'KaiTi'";
            ctx.textAlign = "left";
            ctx.fillText("第一定义：距离差", 120, 150);

            ctx.save();
            ctx.translate(260, 420);
            ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-200, 0); ctx.lineTo(200, 0); ctx.moveTo(0, -180); ctx.lineTo(0, 180); ctx.stroke();
            ctx.strokeStyle = "#0284c7"; ctx.lineWidth = 4;
            ctx.beginPath();
            for(let y = -160; y <= 160; y+=5) {
                let x = 60 * Math.sqrt(1 + (y*y)/(70*70));
                if (y === -160) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.beginPath();
            for(let y = -160; y <= 160; y+=5) {
                let x = -60 * Math.sqrt(1 + (y*y)/(70*70));
                if (y === -160) ctx.moveTo(x, y); else ctx.lineTo(x, y);

                img.onload = () => {
                    if (loaded) return;
                    loaded = true;
                    callback(img);
                };
                img.src = url;

        // ⭐ 彻底重置清空一切涂鸦与多余轨迹
        function clearGraffiti() {
            tracePoints = [];
            graphDrawCtx.save();
            graphDrawCtx.setTransform(1, 0, 0, 1, 0, 0);
            graphDrawCtx.clearRect(0, 0, graphDrawCanvas.width, graphDrawCanvas.height);
            graphDrawCtx.restore();
            graphSnapshot = null;
            isGraphDrawing = false;
            isDraggingPoint = false;
        }

        function resizeCanvases() {
            const rect = canvasInteractiveArea.getBoundingClientRect();
            if (rect.width < 10 || rect.height < 10) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

            p2dCanvas.width = Math.round(rect.width * dpr);
            p2dCanvas.height = Math.round(rect.height * dpr);
            p2dCtx.setTransform(1, 0, 0, 1, 0, 0);
            p2dCtx.scale(dpr, dpr);

            let tempG = null;
            if (graphDrawCanvas.width > 0 && graphDrawCanvas.height > 0) {
                tempG = document.createElement('canvas');
                tempG.width = graphDrawCanvas.width;
                tempG.height = graphDrawCanvas.height;
                tempG.getContext('2d').drawImage(graphDrawCanvas, 0, 0);
            }
            graphDrawCanvas.width = Math.round(rect.width * dpr);
            graphDrawCanvas.height = Math.round(rect.height * dpr);
            graphDrawCtx.setTransform(1, 0, 0, 1, 0, 0);
            graphDrawCtx.scale(dpr, dpr);
            if (tempG && !isPlaneTransitioning) {
                graphDrawCtx.drawImage(tempG, 0, 0, rect.width, rect.height);
            }
        }

        function triggerBookSpawnEffect(x, y) {
            const spark = document.createElement('div');
            spark.className = 'magic-card-spark';
            spark.style.left = x + 'px';
            spark.style.top = y + 'px';
            document.body.appendChild(spark);
            gsap.fromTo(spark, 
                { scale: 0.15, opacity: 1, rotation: -10 },
                { scale: 2.2, opacity: 0, rotation: 35, duration: 0.75, ease: "power2.out", onComplete: () => spark.remove() }
            );
        }

        function riseUpPlaneCenter(key, tapScreenX, tapScreenY) {
            if (isPlaneTransitioning) return;
            isPlaneTransitioning = true;
            plane2DContainer.style.pointerEvents = 'none'; // ⭐ 动效期间彻底禁用点击穿透
            currentActivePlaneKey = key;
            isPlaneActive = true;
            controlsEnabled = false;

            // ⭐ 强制重置工具为拖拽，杜绝铅笔/直线残留
            setGraphTool('drag', btnGDrag);
            isTraceEnabled = false;
            btnToggleTrace.innerText = "🪄 轨迹: 关";
            btnToggleTrace.classList.remove('active');
            clearGraffiti(); // ⭐ 彻底清除

            isAutoPlaying = false;
            updatePlayBtnUI();
            showBaseCurve = false;
            btnToggleCurve.classList.remove('active');
            dynamicHyperBranch = 1;
            parabolaSpeedDir = 1;
            hyperbolaSpeedDir = 1;
            dynamicExT = 0;
            exAnimDir = 1;

            renderPlaneInfo(key);

            modalWrapper.style.display = 'flex';
            resizeCanvases();
            update2DCanvas();

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const startX = tapScreenX || centerX;
            const startY = tapScreenY || centerY;
            lastOriginScreenX = startX;
            lastOriginScreenY = startY;

            triggerBookSpawnEffect(startX, startY);

            // 课本平滑优雅下沉
            gsap.to(bookGroup.position, {
                y: BOOK_NORMAL_Y - 2.4,
                duration: 0.8,
                ease: "power2.out"
            });
            gsap.to(bookGroup.scale, {
                x: 0.92, y: 0.92, z: 0.92,
                duration: 0.8,
                ease: "power2.out"
            });

            const deltaX = startX - centerX;
            const deltaY = startY - centerY;

            gsap.fromTo(modalWrapper, 
                { opacity: 0 }, 
                { opacity: 1, duration: 0.35, ease: "power2.out" }
            );

            gsap.set(plane2DContainer, {
                x: deltaX,
                y: deltaY,
                scale: 0.15,
                rotationX: 35,
                rotationY: deltaX > 0 ? -18 : 18,
                rotationZ: deltaX > 0 ? 6 : -6,
                opacity: 0
            });

            const tl = gsap.timeline({
                onComplete: () => {
                    isPlaneTransitioning = false;
                    plane2DContainer.style.pointerEvents = 'auto'; // ⭐ 动效完成后解禁
                    resizeCanvases();
                    clearGraffiti(); // ⭐ 再次深度清理，杜绝任何形变线段
                    update2DCanvas();
                }
            });

            tl.to(plane2DContainer, {
                y: deltaY - 65,
                scale: 0.32,
                rotationX: 18,
                rotationY: deltaX > 0 ? -9 : 9,
                rotationZ: deltaX > 0 ? 3 : -3,
                opacity: 0.92,
                duration: 0.28,
                ease: "power1.out"
            })
            .to(plane2DContainer, {
                x: 0,
                y: 0,
                scale: 1.0,
                rotationX: 0,
                rotationY: 0,
                rotationZ: 0,
                opacity: 1,
                duration: 0.45,
                ease: "power2.out"
            });
        }

        // 放回课本
        function closePlane() {
            if (isPlaneTransitioning || !isPlaneActive) return;
            if (isGraphFullscreen) toggleGraphFullscreen();

            isPlaneTransitioning = true;
            plane2DContainer.style.pointerEvents = 'none';
            isAutoPlaying = false;

            clearGraffiti(); // ⭐ 重置涂鸦
            isTraceEnabled = false;
            btnToggleTrace.innerText = "🪄 轨迹: 关";
            btnToggleTrace.classList.remove('active');
            setGraphTool('drag', btnGDrag);

            gsap.to(bookGroup.position, {
                y: BOOK_NORMAL_Y,
                duration: 0.7,
                ease: "power2.inOut"
            });
            gsap.to(bookGroup.scale, {
                x: 1.0, y: 1.0, z: 1.0,
                duration: 0.7,
                ease: "power2.inOut"
            });

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const deltaX = lastOriginScreenX - centerX;
            const deltaY = lastOriginScreenY - centerY;

            const tlClose = gsap.timeline({
                onComplete: () => {
                    modalWrapper.style.display = 'none';
                    isPlaneActive = false;
                    currentActivePlaneKey = null;
                    isPlaneTransitioning = false;
                    plane2DContainer.style.pointerEvents = 'auto';
                    controlsEnabled = true;
                    triggerBookSpawnEffect(lastOriginScreenX, lastOriginScreenY);
                }
            });

            tlClose.to(plane2DContainer, {
                x: deltaX,
                y: deltaY - 65,
                scale: 0.28,
                rotationX: 20,
                rotationY: deltaX > 0 ? -10 : 10,
                rotationZ: deltaX > 0 ? 4 : -4,
                duration: 0.3,
                ease: "power2.in"
            })
            .to(plane2DContainer, {
                y: deltaY,
                scale: 0.1,
                rotationX: 38,
                rotationY: deltaX > 0 ? -18 : 18,
                opacity: 0,
                duration: 0.22,
                ease: "power2.out"
            });

            gsap.to(modalWrapper, {
                opacity: 0,
                duration: 0.52,
                ease: "power2.in"
            });
        }
        btnPlaneClose.onclick = closePlane;
        modalWrapper.onclick = (e) => {
            if (e.target === modalWrapper && !isGraphFullscreen) closePlane();
        };

        // 全屏切换：涂鸦自动清除
        function toggleGraphFullscreen() {
            clearGraffiti(); // ⭐ 全屏切换自动清除涂鸦
            isGraphFullscreen = !isGraphFullscreen;
            plane2DContainer.classList.toggle('is-fullscreen', isGraphFullscreen);
            btnFsIcon.innerText = isGraphFullscreen ? "🗗" : "⛶";
            btnFsText.innerText = isGraphFullscreen ? "退出全屏" : "全屏";
            btnGraphFullscreen.classList.toggle('is-active', isGraphFullscreen);

            setTimeout(() => {
                resizeCanvases();
                clearGraffiti();
                update2DCanvas();
            }, 60);
        }
        btnGraphFullscreen.onclick = toggleGraphFullscreen;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isGraphFullscreen) toggleGraphFullscreen();
        });

        /* ========================================================
           6. 动点往返摆动、分支与交互控制
           ======================================================== */
        const btnAutoPlay = document.getElementById('btn-auto-play');
        const btnToggleTrace = document.getElementById('btn-toggle-trace');
        const btnToggleCurve = document.getElementById('btn-toggle-curve');
        const btnSwitchBranch = document.getElementById('btn-switch-branch');
        const btnClearTrace = document.getElementById('btn-clear-trace');

        function updatePlayBtnUI() {
            if (isAutoPlaying) {
                btnAutoPlay.innerText = "⏸ 暂停运动";
                btnAutoPlay.classList.add('active');
            } else {
                btnAutoPlay.innerText = "▶ 自动运动";
                btnAutoPlay.classList.remove('active');
            }
        }

        btnAutoPlay.onclick = () => {
            isAutoPlaying = !isAutoPlaying;
            updatePlayBtnUI();
        };

        btnToggleTrace.onclick = () => {
            isTraceEnabled = !isTraceEnabled;
            if (isTraceEnabled) {
                btnToggleTrace.innerText = "🪄 轨迹: 开";
                btnToggleTrace.classList.add('active');
            } else {
                btnToggleTrace.innerText = "🪄 轨迹: 关";
                btnToggleTrace.classList.remove('active');
            }
        };

        btnToggleCurve.onclick = () => {
            showBaseCurve = !showBaseCurve;
            if (showBaseCurve) btnToggleCurve.classList.add('active');
            else btnToggleCurve.classList.remove('active');
        };

        btnSwitchBranch.onclick = () => {
            dynamicHyperBranch = dynamicHyperBranch === 1 ? -1 : 1;
            btnSwitchBranch.innerText = dynamicHyperBranch === 1 ? "⇄ 切到左支" : "⇄ 切到右支";
            tracePoints = [];
            update2DCanvas();
        };

        btnClearTrace.onclick = () => {
            tracePoints = [];
        };

        function advanceAutoMotion() {
            if (!isAutoPlaying || !isPlaneActive || isPlaneTransitioning) return;

            if (currentActivePlaneKey && currentActivePlaneKey.startsWith('el-')) {
                dynamicTheta += 0.022;
                if (dynamicTheta > Math.PI * 2) dynamicTheta -= Math.PI * 2;
            } else if (currentActivePlaneKey && currentActivePlaneKey.startsWith('hyp-')) {
                dynamicHyperbolaT += 0.025 * hyperbolaSpeedDir;
                if (dynamicHyperbolaT > 1.85) {
                    dynamicHyperbolaT = 1.85;
                    hyperbolaSpeedDir = -1;
                } else if (dynamicHyperbolaT < -1.85) {
                    dynamicHyperbolaT = -1.85;
                    hyperbolaSpeedDir = 1;
                }
            } else if (currentActivePlaneKey && currentActivePlaneKey.startsWith('ex-')) {
                dynamicExT += 0.012 * exAnimDir;
                if (dynamicExT > 1.4) {
                    dynamicExT = 1.4;
                    exAnimDir = -1;
                } else if (dynamicExT < -1.4) {
                    dynamicExT = -1.4;
                    exAnimDir = 1;
                }
                const sliderEx = document.getElementById('slider-ex');
                if (sliderEx) sliderEx.value = dynamicExT;
            } else {
                dynamicParabolaT += 0.07 * parabolaSpeedDir;
                if (dynamicParabolaT > 4.5) {
                    dynamicParabolaT = 4.5;
                    parabolaSpeedDir = -1;
                } else if (dynamicParabolaT < -4.5) {
                    dynamicParabolaT = -4.5;
                    parabolaSpeedDir = 1;
                }
            }
        }

                    <div class="formula-highlight">
                        $a=1, c=2 \\implies b^2 = 3$<br>
                        <b>方程：$x^2 - \\dfrac{y^2}{3} = 1 \\quad (x \\le -1)$</b>
                    </div>
                    <div style="margin-top:6px;">正确选项：<span class="ans-badge">B</span></div>

                    <h3>【几何特征】准线位置与离心率</h3>

                    <div class="formula-highlight">
                        $$c = ae, \\quad \\text{准线: } x = \\pm \\frac{a}{e}$$

                title = "❹ 椭圆特殊点验证 · 顶点极限";

                    • 焦半径：$|PF| = a - c$<br>
                    • 准线距：$|PM| = \\frac{a}{e} - a = \\frac{a - c}{e}$<br>
                    • 距离比：$\\frac{|PF|}{|PM|} = e$ 恒成立！</div>

                    <h3>【核心定义】两焦点距离差的绝对值为定值</h3>

        /* ========================================================
           8. 核心绘制系统：标准坐标轴 + 无多余斜线
           ======================================================== */
        function drawCanvasLine(ctx, x1, y1, x2, y2, isDash = false, color = "#261d15", width = 2) {
            ctx.save(); ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width;
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            if (isDash) ctx.setLineDash([7, 5]);
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
        }

        function drawCanvasText(ctx, text, x, y, color = "#261d15", font = "bold 15px 'KaiTi'") {
            ctx.save(); ctx.font = font; ctx.fillStyle = color; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, x, y); ctx.restore();
        }

        function drawStandardAxes(ctx, cx, cy, w, h) {
            ctx.save();
            ctx.strokeStyle = "#64748b";
            ctx.lineWidth = 1.6;
            ctx.lineCap = "round";

            // X 轴
            ctx.beginPath();
            ctx.moveTo(15, cy);
            ctx.lineTo(w - 15, cy);
            ctx.stroke();

            // X 箭头
            ctx.beginPath();
            ctx.moveTo(w - 15, cy);
            ctx.lineTo(w - 23, cy - 4.5);
            ctx.lineTo(w - 23, cy + 4.5);
            ctx.closePath();
            ctx.fillStyle = "#64748b";
            ctx.fill();

            // Y 轴
            ctx.beginPath();
            ctx.moveTo(cx, h - 15);
            ctx.lineTo(cx, 15);
            ctx.stroke();

            // Y 箭头
            ctx.beginPath();
            ctx.moveTo(cx, 15);
            ctx.lineTo(cx - 4.5, 23);
            ctx.lineTo(cx + 4.5, 23);
            ctx.closePath();
            ctx.fillStyle = "#64748b";
            ctx.fill();

            // 轴名称与原点
            ctx.font = "bold 15px 'KaiTi', serif";
            ctx.fillStyle = "#475569";
            ctx.textAlign = "right";
            ctx.fillText("0", cx - 8, cy + 16);
            ctx.textAlign = "left";
            ctx.fillText("x", w - 16, cy + 18);
            ctx.fillText("y", cx + 12, 18);

            ctx.restore();
        }

        function update2DCanvas() {
            if (!isPlaneActive) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
            const w = p2dCanvas.width / dpr;
            const h = p2dCanvas.height / dpr;

            p2dCtx.clearRect(0, 0, w, h);

            // 淡雅纸质网格背景
            p2dCtx.save();
            p2dCtx.strokeStyle = "rgba(218, 202, 181, 0.35)";
            p2dCtx.lineWidth = 1;
            for (let x = 0; x < w; x += 34) { p2dCtx.beginPath(); p2dCtx.moveTo(x, 0); p2dCtx.lineTo(x, h); p2dCtx.stroke(); }
            for (let y = 0; y < h; y += 34) { p2dCtx.beginPath(); p2dCtx.moveTo(0, y); p2dCtx.lineTo(w, y); p2dCtx.stroke(); }
            p2dCtx.restore();

            const cx = w * 0.48, cy = h * 0.5;

            // ⭐ 仅当非动画展开状态且用户主动打开轨迹时才渲染轨迹线
            if (isTraceEnabled && !isPlaneTransitioning && tracePoints.length > 1) {
                p2dCtx.save();
                p2dCtx.strokeStyle = "rgba(180, 61, 14, 0.82)";
                p2dCtx.lineWidth = 3.5;
                p2dCtx.lineCap = 'round';
                p2dCtx.lineJoin = 'round';
                p2dCtx.beginPath();
                for (let i = 0; i < tracePoints.length; i++) {
                    if (i === 0) p2dCtx.moveTo(tracePoints[i].x, tracePoints[i].y);
                    else p2dCtx.lineTo(tracePoints[i].x, tracePoints[i].y);
                }
                p2dCtx.stroke();
                p2dCtx.restore();
            }

            // ==================== A. 例题 2 绘制 ====================
            if (currentActivePlaneKey === 'ex-2') {
                const exScale = 22;
                const cExX = w * 0.48, cExY = h * 0.44;

                drawStandardAxes(p2dCtx, cExX, cExY, w, h);

                const M1 = { x: 0, y: -5, r: 1 };
                const M2 = { x: 0, y: 5, r: 7 };

                p2dCtx.beginPath();
                p2dCtx.arc(cExX + M2.x * exScale, cExY - M2.y * exScale, M2.r * exScale, 0, Math.PI * 2);
                p2dCtx.fillStyle = "rgba(148, 163, 184, 0.14)";
                p2dCtx.fill();
                p2dCtx.strokeStyle = "#64748b";
                p2dCtx.lineWidth = 1.8;
                p2dCtx.stroke();

                p2dCtx.beginPath();
                p2dCtx.arc(cExX + M1.x * exScale, cExY - M1.y * exScale, M1.r * exScale, 0, Math.PI * 2);
                p2dCtx.fillStyle = "rgba(148, 163, 184, 0.28)";
                p2dCtx.fill();
                p2dCtx.strokeStyle = "#475569";
                p2dCtx.lineWidth = 1.8;
                p2dCtx.stroke();

                if (showBaseCurve) {
                    p2dCtx.save();
                    p2dCtx.strokeStyle = "rgba(37, 99, 235, 0.55)";
                    p2dCtx.lineWidth = 2.4;
                    p2dCtx.beginPath();
                    for (let u = -2.2; u <= 2.2; u += 0.05) {
                        const hy = -3 * Math.cosh(u);
                        const hx = 4 * Math.sinh(u);
                        const px = cExX + hx * exScale;
                        const py = cExY - hy * exScale;
                        if (u === -2.2) p2dCtx.moveTo(px, py); else p2dCtx.lineTo(px, py);
                    }
                    p2dCtx.stroke();
                    p2dCtx.restore();
                }

                const Py = -3 * Math.cosh(dynamicExT);
                const Px = 4 * Math.sinh(dynamicExT);
                const px = cExX + Px * exScale;
                const py = cExY - Py * exScale;

                const distM1 = Math.hypot(Px - M1.x, Py - M1.y);
                const distM2 = Math.hypot(Px - M2.x, Py - M2.y);
                const R = distM1 - M1.r;

                // ⭐ 绝不在动效期间记录打点
                if (isTraceEnabled && !isPlaneTransitioning) {
                    tracePoints.push({ x: px, y: py });
                    if (tracePoints.length > 500) tracePoints.shift();
                }

                p2dCtx.beginPath();
                p2dCtx.arc(px, py, R * exScale, 0, Math.PI * 2);
                p2dCtx.fillStyle = "rgba(59, 130, 246, 0.12)";
                p2dCtx.fill();
                p2dCtx.strokeStyle = "#2563eb";
                p2dCtx.lineWidth = 2.2;
                p2dCtx.stroke();

                drawCanvasLine(p2dCtx, px, py, cExX + M1.x * exScale, cExY - M1.y * exScale, false, "#10b981", 2.2);
                drawCanvasLine(p2dCtx, px, py, cExX + M2.x * exScale, cExY - M2.y * exScale, false, "#f59e0b", 2.2);

                drawCanvasText(p2dCtx, "M₁(0,-5)", cExX + 35, cExY - M1.y * exScale, "#10b981", "bold 14px sans-serif");
                drawCanvasText(p2dCtx, "M₂(0,5)", cExX + 35, cExY - M2.y * exScale, "#f59e0b", "bold 14px sans-serif");
                drawCanvasText(p2dCtx, "P", px + 15, py - 15, "#2563eb", "bold 16px sans-serif");

                p2dCtx.fillStyle = "rgba(247, 241, 230, 0.88)";
                p2dCtx.beginPath(); p2dCtx.roundRect(25, 25, 260, 90, 10); p2dCtx.fill();
                p2dCtx.strokeStyle = "#d8caa5"; p2dCtx.lineWidth = 1.2; p2dCtx.stroke();
                drawCanvasText(p2dCtx, `|PM₂| (到大圆心) = ${distM2.toFixed(2)} (R+7)`, 155, 42, "#f59e0b", "bold 13px monospace");
                drawCanvasText(p2dCtx, `|PM₁| (到小圆心) = ${distM1.toFixed(2)} (R+1)`, 155, 64, "#10b981", "bold 13px monospace");
                drawCanvasText(p2dCtx, `差值 |PM₂|-|PM₁| ≡ ${(distM2 - distM1).toFixed(2)} (=2a=6)`, 155, 88, "#2563eb", "bold 14px monospace");

            // ==================== B. 课堂精练 1 绘制 ====================
            } else if (currentActivePlaneKey === 'ex-1') {
                const scale = 52;
                drawStandardAxes(p2dCtx, cx, cy, w, h);

                const F1 = { x: -2, y: 0, r: 1 };
                const F2 = { x: 2, y: 0, r: 1 };

                [F1, F2].forEach((f, idx) => {
                    p2dCtx.beginPath();
                    p2dCtx.arc(cx + f.x * scale, cy - f.y * scale, f.r * scale, 0, Math.PI * 2);
                    p2dCtx.fillStyle = idx === 0 ? "rgba(16, 185, 129, 0.16)" : "rgba(245, 158, 11, 0.16)";
                    p2dCtx.fill();
                    p2dCtx.strokeStyle = idx === 0 ? "#10b981" : "#f59e0b";
                    p2dCtx.lineWidth = 2;
                    p2dCtx.stroke();
                });

                if (showBaseCurve) {
                    p2dCtx.save();
                    p2dCtx.strokeStyle = "rgba(79, 70, 229, 0.55)";
                    p2dCtx.lineWidth = 2.4;
                    p2dCtx.beginPath();
                    for (let u = -1.8; u <= 1.8; u += 0.05) {
                        const hx = -1 * Math.cosh(u);
                        const hy = Math.sqrt(3) * Math.sinh(u);
                        const px = cx + hx * scale;
                        const py = cy - hy * scale;
                        if (u === -1.8) p2dCtx.moveTo(px, py); else p2dCtx.lineTo(px, py);
                    }
                    p2dCtx.stroke();
                    p2dCtx.restore();
                }

                const Px = -1 * Math.cosh(dynamicExT);
                const Py = Math.sqrt(3) * Math.sinh(dynamicExT);
                const px = cx + Px * scale;
                const py = cy - Py * scale;

                const distF1 = Math.hypot(Px - F1.x, Py - F1.y);
                const distF2 = Math.hypot(Px - F2.x, Py - F2.y);
                const R = distF1 + F1.r;

                if (isTraceEnabled && !isPlaneTransitioning) {
                    tracePoints.push({ x: px, y: py });
                    if (tracePoints.length > 500) tracePoints.shift();
                }

                p2dCtx.beginPath();
                p2dCtx.arc(px, py, R * scale, 0, Math.PI * 2);
                p2dCtx.fillStyle = "rgba(79, 70, 229, 0.08)";
                p2dCtx.fill();
                p2dCtx.strokeStyle = "#4f46e5";
                p2dCtx.lineWidth = 2.2;
                p2dCtx.stroke();

                drawCanvasLine(p2dCtx, px, py, cx + F1.x * scale, cy - F1.y * scale, false, "#10b981", 2.2);
                drawCanvasLine(p2dCtx, px, py, cx + F2.x * scale, cy - F2.y * scale, false, "#f59e0b", 2.2);

                drawCanvasText(p2dCtx, "F₁(-2,0)", cx + F1.x * scale, cy + 22, "#10b981");
                drawCanvasText(p2dCtx, "F₂(2,0)", cx + F2.x * scale, cy + 22, "#f59e0b");
                drawCanvasText(p2dCtx, "C", px - 16, py - 14, "#4f46e5", "bold 16px sans-serif");

                p2dCtx.fillStyle = "rgba(247, 241, 230, 0.88)";
                p2dCtx.beginPath(); p2dCtx.roundRect(25, 25, 270, 90, 10); p2dCtx.fill();
                p2dCtx.strokeStyle = "#d8caa5"; p2dCtx.lineWidth = 1.2; p2dCtx.stroke();
                drawCanvasText(p2dCtx, `|CF₁| (内切内含) = ${distF1.toFixed(2)} (R-1)`, 160, 42, "#10b981", "bold 13px monospace");
                drawCanvasText(p2dCtx, `|CF₂| (外切) = ${distF2.toFixed(2)} (R+1)`, 160, 64, "#f59e0b", "bold 13px monospace");
                drawCanvasText(p2dCtx, `|CF₂| - |CF₁| ≡ ${(distF2 - distF1).toFixed(2)} (=2a=2)`, 160, 88, "#4f46e5", "bold 14px monospace");

            // ==================== C. 例题 5 绘制 ====================
            } else if (currentActivePlaneKey === 'ex-5') {
                const scale = 65;
                const cExX = w * 0.42;
                drawStandardAxes(p2dCtx, cExX, cy, w, h);

                const a = Math.sqrt(2);
                const b = 1;
                const c = Math.sqrt(3);
                const slope = Math.SQRT1_2;

                p2dCtx.save();
                p2dCtx.strokeStyle = "rgba(100, 116, 139, 0.65)";
                p2dCtx.lineWidth = 1.6;
                p2dCtx.beginPath();
                p2dCtx.moveTo(cExX - 4 * scale, cy + 4 * slope * scale);
                p2dCtx.lineTo(cExX + 5 * scale, cy - 5 * slope * scale);
                p2dCtx.stroke();
                p2dCtx.restore();
                drawCanvasText(p2dCtx, "渐近线 l: x - √2y = 0", cExX + 3.8 * scale, cy - 3.8 * slope * scale - 15, "#64748b", "13px 'KaiTi'");

                p2dCtx.save();
                p2dCtx.strokeStyle = "#2563eb";
                p2dCtx.lineWidth = 2.4;
                p2dCtx.beginPath();
                for (let u = -1.8; u <= 1.8; u += 0.05) {
                    const hx = a * Math.cosh(u);
                    const hy = b * Math.sinh(u);
                    const px = cExX + hx * scale;
                    const py = cy - hy * scale;
                    if (u === -1.8) p2dCtx.moveTo(px, py); else p2dCtx.lineTo(px, py);
                }
                p2dCtx.stroke();
                p2dCtx.restore();

                const Px = a * Math.cosh(dynamicExT);
                const Py = b * Math.sinh(dynamicExT);
                const px = cExX + Px * scale;
                const py = cy - Py * scale;

                const xQ = (Px + slope * Py) / (1 + slope * slope);
                const yQ = slope * xQ;
                const qx = cExX + xQ * scale;
                const qy = cy - yQ * scale;

                const F1x = cExX - c * scale;
                const F2x = cExX + c * scale;

                const distPF1 = Math.hypot(Px - (-c), Py - 0);
                const distPF2 = Math.hypot(Px - c, Py - 0);
                const distPQ = Math.hypot(Px - xQ, Py - yQ);
                const total = distPF1 + distPQ;

                if (isTraceEnabled && !isPlaneTransitioning) {
                    tracePoints.push({ x: px, y: py });
                    if (tracePoints.length > 500) tracePoints.shift();
                }

                drawCanvasLine(p2dCtx, px, py, F1x, cy, false, "#ef4444", 2.4);
                drawCanvasLine(p2dCtx, px, py, qx, qy, false, "#8b5cf6", 2.4);
                drawCanvasLine(p2dCtx, px, py, F2x, cy, false, "rgba(245, 158, 11, 0.7)", 1.8);

                p2dCtx.fillStyle = "#ef4444"; p2dCtx.beginPath(); p2dCtx.arc(F1x, cy, 5, 0, Math.PI*2); p2dCtx.fill();
                p2dCtx.fillStyle = "#f59e0b"; p2dCtx.beginPath(); p2dCtx.arc(F2x, cy, 5, 0, Math.PI*2); p2dCtx.fill();
                p2dCtx.fillStyle = "#8b5cf6"; p2dCtx.beginPath(); p2dCtx.arc(qx, qy, 5, 0, Math.PI*2); p2dCtx.fill();
                p2dCtx.fillStyle = "#2563eb"; p2dCtx.beginPath(); p2dCtx.arc(px, py, 7, 0, Math.PI*2); p2dCtx.fill();

                drawCanvasText(p2dCtx, "F₁", F1x, cy + 18, "#ef4444");
                drawCanvasText(p2dCtx, "F₂", F2x, cy + 18, "#f59e0b");
                drawCanvasText(p2dCtx, "Q", qx - 14, qy - 12, "#8b5cf6");
                drawCanvasText(p2dCtx, "P", px + 15, py - 14, "#2563eb", "bold 16px sans-serif");

                const isNearMin = Math.abs(dynamicExT - 0.28) < 0.08;

                p2dCtx.fillStyle = "rgba(247, 241, 230, 0.88)";
                p2dCtx.beginPath(); p2dCtx.roundRect(25, 25, 275, 95, 10); p2dCtx.fill();
                p2dCtx.strokeStyle = "#d8caa5"; p2dCtx.lineWidth = 1.2; p2dCtx.stroke();
                drawCanvasText(p2dCtx, `|PF₁| = ${distPF1.toFixed(3)}`, 162, 42, "#ef4444", "bold 13px monospace");
                drawCanvasText(p2dCtx, `|PQ| = ${distPQ.toFixed(3)}`, 162, 62, "#8b5cf6", "bold 13px monospace");
                drawCanvasText(p2dCtx, `|PF₁| + |PQ| = ${total.toFixed(3)} ${isNearMin ? '★达最小值' : ''}`, 162, 84, isNearMin ? "#10b981" : "#b43d0e", "bold 14px monospace");

            // ==================== D. 前两页概念：椭圆绘制 ====================
            } else if (currentActivePlaneKey && currentActivePlaneKey.startsWith('el-')) {
                drawStandardAxes(p2dCtx, cx, cy, w, h);

                const mathA = 5.6; 
                const mathE = paramEllipseE;
                const mathC = mathA * mathE;
                const mathB = Math.sqrt(mathA * mathA - mathC * mathC);
                const mathDirX = mathA / mathE;

                const aPx = mathA * MATH_SCALE;
                const bPx = mathB * MATH_SCALE;
                const cPx = mathC * MATH_SCALE;
                const dirXPx = mathDirX * MATH_SCALE;

                if (showBaseCurve) {
                    p2dCtx.save();
                    p2dCtx.beginPath();
                    p2dCtx.strokeStyle = "#0284c7";
                    p2dCtx.lineWidth = 3.2;
                    p2dCtx.ellipse(cx, cy, aPx, bPx, 0, 0, Math.PI * 2);
                    p2dCtx.stroke();
                    p2dCtx.restore();
                }

                drawCanvasLine(p2dCtx, cx + dirXPx, 25, cx + dirXPx, h - 25, false, "#d97706", 2.0);
                drawCanvasText(p2dCtx, `准线 x = a²/c`, cx + dirXPx, 16, "#d97706", "bold 14px 'KaiTi'");

                p2dCtx.fillStyle = "#dc2626";
                p2dCtx.beginPath(); p2dCtx.arc(cx + cPx, cy, 5.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "F(c,0)", cx + cPx, cy + 18, "#dc2626", "bold 15px 'KaiTi'");

                const px = cx + aPx * Math.cos(dynamicTheta);
                const py = cy - bPx * Math.sin(dynamicTheta);
                const mx = cx + dirXPx;
                const my = py;

                if (isTraceEnabled && !isPlaneTransitioning) {
                    tracePoints.push({ x: px, y: py });
                    if (tracePoints.length > 500) tracePoints.shift();
                }

                drawCanvasLine(p2dCtx, px, py, cx + cPx, cy, false, "#dc2626", 2.6);
                drawCanvasLine(p2dCtx, px, py, mx, my, false, "#059669", 2.6);

                p2dCtx.fillStyle = "#059669";
                p2dCtx.beginPath(); p2dCtx.arc(mx, my, 4.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "M", mx + 14, my, "#059669", "bold 15px 'KaiTi'");

                p2dCtx.fillStyle = "#2563eb";
                p2dCtx.beginPath(); p2dCtx.arc(px, py, 8, 0, Math.PI * 2); p2dCtx.fill();
                p2dCtx.strokeStyle = "#ffffff"; p2dCtx.lineWidth = 2.5; p2dCtx.stroke();
                drawCanvasText(p2dCtx, "P", px, py - 18, "#1e3a8a", "bold 15px 'KaiTi'");

                const realDistPF = Math.hypot(px - (cx + cPx), py - cy) / MATH_SCALE;
                const realDistPM = Math.abs(mx - px) / MATH_SCALE;
                const realRatio = realDistPF / realDistPM;

                p2dCtx.fillStyle = "rgba(247, 241, 230, 0.88)";
                p2dCtx.beginPath(); p2dCtx.roundRect(25, 25, 210, 75, 10); p2dCtx.fill();
                p2dCtx.strokeStyle = "#d8caa5"; p2dCtx.strokeRect(25, 25, 210, 75);
                drawCanvasText(p2dCtx, `焦半径 |PF| = ${realDistPF.toFixed(2)}`, 130, 42, "#dc2626", "bold 14px monospace");
                drawCanvasText(p2dCtx, `准线距 |PM| = ${realDistPM.toFixed(2)}`, 130, 62, "#059669", "bold 14px monospace");
                drawCanvasText(p2dCtx, `比值 e ≡ ${(realRatio).toFixed(2)}`, 130, 82, "#0284c7", "bold 15px monospace");

            // ==================== E. 前两页概念：双曲线绘制 ====================
            } else if (currentActivePlaneKey && currentActivePlaneKey.startsWith('hyp-')) {
                drawStandardAxes(p2dCtx, cx, cy, w, h);

                const mathA = 3.5;
                const mathE = paramHyperbolaE;
                const mathC = mathA * mathE;
                const mathB = Math.sqrt(mathC * mathC - mathA * mathA);
                const mathDirX = mathA / mathE;

                const aPx = mathA * MATH_SCALE;
                const bPx = mathB * MATH_SCALE;
                const cPx = mathC * MATH_SCALE;
                const dirXPx = mathDirX * MATH_SCALE;

                if (showBaseCurve) {
                    p2dCtx.save();
                    p2dCtx.strokeStyle = "rgba(100, 116, 139, 0.5)"; p2dCtx.lineWidth = 1.4;
                    const k = bPx / aPx;
                    p2dCtx.beginPath();
                    p2dCtx.moveTo(cx - 300, cy - 300 * k); p2dCtx.lineTo(cx + 300, cy + 300 * k);
                    p2dCtx.moveTo(cx - 300, cy + 300 * k); p2dCtx.lineTo(cx + 300, cy - 300 * k);
                    p2dCtx.stroke();
                    p2dCtx.restore();

                    p2dCtx.save();
                    p2dCtx.strokeStyle = "#0284c7";
                    p2dCtx.lineWidth = 3.2;
                    p2dCtx.beginPath();
                    for (let t = -2.2; t <= 2.2; t += 0.05) {
                        const rx = cx + aPx * Math.cosh(t);
                        const ry = cy - bPx * Math.sinh(t);
                        if (t === -2.2) p2dCtx.moveTo(rx, ry); else p2dCtx.lineTo(rx, ry);
                    }
                    p2dCtx.stroke();
                    p2dCtx.beginPath();
                    for (let t = -2.2; t <= 2.2; t += 0.05) {
                        const lx = cx - aPx * Math.cosh(t);
                        const ly = cy - bPx * Math.sinh(t);
                        if (t === -2.2) p2dCtx.moveTo(lx, ly); else p2dCtx.lineTo(lx, ly);
                    }
                    p2dCtx.stroke();
                    p2dCtx.restore();
                }

                p2dCtx.fillStyle = "#dc2626";
                p2dCtx.beginPath(); p2dCtx.arc(cx - cPx, cy, 5.5, 0, Math.PI * 2); p2dCtx.fill();
                p2dCtx.beginPath(); p2dCtx.arc(cx + cPx, cy, 5.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "F₁", cx - cPx, cy + 18, "#dc2626", "bold 15px 'KaiTi'");
                drawCanvasText(p2dCtx, "F₂", cx + cPx, cy + 18, "#dc2626", "bold 15px 'KaiTi'");

                const px = cx + dynamicHyperBranch * aPx * Math.cosh(dynamicHyperbolaT);
                const py = cy - bPx * Math.sinh(dynamicHyperbolaT);

                if (isTraceEnabled && !isPlaneTransitioning) {
                    tracePoints.push({ x: px, y: py });
                    if (tracePoints.length > 500) tracePoints.shift();
                }

                p2dCtx.fillStyle = "#2563eb";
                p2dCtx.beginPath(); p2dCtx.arc(px, py, 8, 0, Math.PI * 2); p2dCtx.fill();
                p2dCtx.strokeStyle = "#ffffff"; p2dCtx.lineWidth = 2.5; p2dCtx.stroke();
                drawCanvasText(p2dCtx, "P", px + (dynamicHyperBranch > 0 ? 16 : -16), py - 14, "#1e3a8a", "bold 15px 'KaiTi'");

                if (currentActivePlaneKey === 'hyp-def1') {
                    drawCanvasLine(p2dCtx, px, py, cx - cPx, cy, false, "#e11d48", 2.6);
                    drawCanvasLine(p2dCtx, px, py, cx + cPx, cy, false, "#eab308", 2.6);

                    const d1 = Math.hypot(px - (cx - cPx), py - cy) / MATH_SCALE;
                    const d2 = Math.hypot(px - (cx + cPx), py - cy) / MATH_SCALE;
                    const diff = Math.abs(d1 - d2);

                    p2dCtx.fillStyle = "rgba(247, 241, 230, 0.88)";
                    p2dCtx.beginPath(); p2dCtx.roundRect(25, 25, 230, 75, 10); p2dCtx.fill();
                    p2dCtx.strokeStyle = "#d8caa5"; p2dCtx.strokeRect(25, 25, 230, 75);
                    drawCanvasText(p2dCtx, `|PF₁| = ${d1.toFixed(2)}`, 140, 42, "#e11d48", "bold 14px monospace");
                    drawCanvasText(p2dCtx, `|PF₂| = ${d2.toFixed(2)}`, 140, 62, "#d97706", "bold 14px monospace");
                    drawCanvasText(p2dCtx, `距离差 ||PF₁|-|PF₂|| ≡ ${diff.toFixed(2)} (2a)`, 140, 82, "#0284c7", "bold 13px monospace");
                } else {
                    drawCanvasLine(p2dCtx, cx - dirXPx, 25, cx - dirXPx, h - 25, false, "#d97706", 2.0);
                    drawCanvasLine(p2dCtx, cx + dirXPx, 25, cx + dirXPx, h - 25, false, "#d97706", 2.0);
                    drawCanvasText(p2dCtx, "x=-a²/c", cx - dirXPx, 16, "#d97706", "bold 13px 'KaiTi'");
                    drawCanvasText(p2dCtx, "x=a²/c", cx + dirXPx, 16, "#d97706", "bold 13px 'KaiTi'");

                    const activeFocusX = dynamicHyperBranch > 0 ? cx + cPx : cx - cPx;
                    const activeDirX = dynamicHyperBranch > 0 ? cx + dirXPx : cx - dirXPx;

                    drawCanvasLine(p2dCtx, px, py, activeFocusX, cy, false, "#dc2626", 2.6);
                    drawCanvasLine(p2dCtx, px, py, activeDirX, py, false, "#059669", 2.6);

                    p2dCtx.fillStyle = "#059669";
                    p2dCtx.beginPath(); p2dCtx.arc(activeDirX, py, 4.5, 0, Math.PI * 2); p2dCtx.fill();
                    drawCanvasText(p2dCtx, "H", activeDirX + (dynamicHyperBranch > 0 ? -14 : 14), py - 10, "#059669", "bold 15px 'KaiTi'");

                    const realPF = Math.hypot(px - activeFocusX, py - cy) / MATH_SCALE;
                    const realPH = Math.abs(activeDirX - px) / MATH_SCALE;
                    const ratio = realPF / realPH;

                    p2dCtx.fillStyle = "rgba(247, 241, 230, 0.88)";
                    p2dCtx.beginPath(); p2dCtx.roundRect(25, 25, 220, 75, 10); p2dCtx.fill();
                    p2dCtx.strokeStyle = "#d8caa5"; p2dCtx.strokeRect(25, 25, 220, 75);
                    drawCanvasText(p2dCtx, `焦半径 |PF| = ${realPF.toFixed(2)}`, 135, 42, "#dc2626", "bold 14px monospace");
                    drawCanvasText(p2dCtx, `准线距 |PH| = ${realPH.toFixed(2)}`, 135, 62, "#059669", "bold 14px monospace");
                    drawCanvasText(p2dCtx, `比值 e ≡ ${(ratio).toFixed(2)} (>1)`, 135, 82, "#0284c7", "bold 14px monospace");
                }

            // ==================== F. 前两页概念：抛物线绘制 ====================
            } else {
                drawStandardAxes(p2dCtx, cx, cy, w, h);

                const mathP = paramParabolaP;
                const pPx = mathP * MATH_SCALE;
                let dir = 'right';
                if (currentActivePlaneKey === 'pa-left') dir = 'left';
                else if (currentActivePlaneKey === 'pa-up') dir = 'up';
                else if (currentActivePlaneKey === 'pa-down') dir = 'down';

                let fx = cx, fy = cy, lx1 = 0, ly1 = 0, lx2 = 0, ly2 = 0;
                if (dir === 'right') {
                    fx = cx + pPx/2; fy = cy;
                    lx1 = cx - pPx/2; ly1 = 25; lx2 = cx - pPx/2; ly2 = h - 25;
                } else if (dir === 'left') {
                    fx = cx - pPx/2; fy = cy;
                    lx1 = cx + pPx/2; ly1 = 25; lx2 = cx + pPx/2; ly2 = h - 25;
                } else if (dir === 'up') {
                    fx = cx; fy = cy - pPx/2;
                    lx1 = 25; ly1 = cy + pPx/2; lx2 = w - 25; ly2 = cy + pPx/2;
                } else {
                    fx = cx; fy = cy + pPx/2;
                    lx1 = 25; ly1 = cy - pPx/2; lx2 = w - 25; ly2 = cy - pPx/2;
                }

                drawCanvasLine(p2dCtx, lx1, ly1, lx2, ly2, false, "#d97706", 2.2);
                drawCanvasText(p2dCtx, "准线 l", dir === 'up' || dir === 'down' ? w - 25 : lx1, dir === 'up' || dir === 'down' ? ly1 - 14 : 16, "#d97706", "bold 14px 'KaiTi'");

                p2dCtx.fillStyle = "#dc2626"; p2dCtx.beginPath(); p2dCtx.arc(fx, fy, 5.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "F", fx + 14, fy + 14, "#dc2626", "bold 15px 'KaiTi'");

                const tVal = dynamicParabolaT;
                let px = 0, py = 0, mx = 0, my = 0;
                if (dir === 'right') {
                    px = cx + ((tVal*tVal)/(2*mathP)) * MATH_SCALE; py = cy + tVal * MATH_SCALE;
                    mx = cx - pPx/2; my = py;
                } else if (dir === 'left') {
                    px = cx - ((tVal*tVal)/(2*mathP)) * MATH_SCALE; py = cy + tVal * MATH_SCALE;
                    mx = cx + pPx/2; my = py;
                } else if (dir === 'up') {
                    px = cx + tVal * MATH_SCALE; py = cy - ((tVal*tVal)/(2*mathP)) * MATH_SCALE;
                    mx = px; my = cy + pPx/2;
                } else {
                    px = cx + tVal * MATH_SCALE; py = cy + ((tVal*tVal)/(2*mathP)) * MATH_SCALE;
                    mx = px; my = cy - pPx/2;
                }

                if (isTraceEnabled && !isPlaneTransitioning) {
                    tracePoints.push({ x: px, y: py });
                    if (tracePoints.length > 500) tracePoints.shift();
                }

                drawCanvasLine(p2dCtx, px, py, fx, fy, false, "#dc2626", 2.6);
                drawCanvasLine(p2dCtx, px, py, mx, my, false, "#059669", 2.6);

                p2dCtx.fillStyle = "#059669"; p2dCtx.beginPath(); p2dCtx.arc(mx, my, 4.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "M", mx + 14, my - 8, "#059669", "bold 14px 'KaiTi'");

                p2dCtx.fillStyle = "#2563eb"; p2dCtx.beginPath(); p2dCtx.arc(px, py, 8, 0, Math.PI * 2); p2dCtx.fill();
                p2dCtx.strokeStyle = "#ffffff"; p2dCtx.lineWidth = 2.5; p2dCtx.stroke();
                drawCanvasText(p2dCtx, "P", px + 16, py - 16, "#1e3a8a", "bold 15px 'KaiTi'");

                const realD1 = Math.hypot(px - fx, py - fy) / MATH_SCALE;
                const realD2 = Math.hypot(px - mx, py - my) / MATH_SCALE;

                p2dCtx.fillStyle = "rgba(247, 241, 230, 0.88)"; p2dCtx.beginPath(); p2dCtx.roundRect(25, 25, 210, 70, 10); p2dCtx.fill();
                p2dCtx.strokeStyle = "#d8caa5"; p2dCtx.strokeRect(25, 25, 210, 70);
                drawCanvasText(p2dCtx, `焦半径 |PF| = ${realD1.toFixed(2)}`, 130, 45, "#dc2626", "bold 14px monospace");
                drawCanvasText(p2dCtx, `准线距 |PM| = ${realD2.toFixed(2)}`, 130, 68, "#059669", "bold 14px monospace");
            }
        }

        /* ========================================================
           9. 动点手动拖拽与图形标注涂鸦系统
           ======================================================== */
        let graphTool = 'drag';
        let graphColor = '#dc2626';
        let isGraphDrawing = false;
        let graphStartX = 0, graphStartY = 0;
        let graphSnapshot = null;

        function getExactPos(canvas, e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function handlePointerTrack(e) {
            if (isPlaneTransitioning) return;
            const rect = canvasInteractiveArea.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
            const w = p2dCanvas.width / dpr;
            const h = p2dCanvas.height / dpr;

            const mouseCanvasX = (e.clientX - rect.left);
            const mouseCanvasY = (e.clientY - rect.top);
            const cx = w * 0.48;
            const cy = h * 0.5;

            const dx = mouseCanvasX - cx;
            const dy = mouseCanvasY - cy;

            if (currentActivePlaneKey && currentActivePlaneKey.startsWith('ex-')) {
                dynamicExT = Math.max(-1.4, Math.min(1.4, dx / 80));
                const sliderEx = document.getElementById('slider-ex');
                if (sliderEx) sliderEx.value = dynamicExT;
                const lbl = document.getElementById('label-ex-val');
                if (lbl) lbl.innerText = dynamicExT.toFixed(2);
            } else if (currentActivePlaneKey && currentActivePlaneKey.startsWith('el-')) {
                dynamicTheta = Math.atan2(-dy, dx);
            } else if (currentActivePlaneKey && currentActivePlaneKey.startsWith('hyp-')) {
                dynamicHyperBranch = dx >= 0 ? 1 : -1;
                btnSwitchBranch.innerText = dynamicHyperBranch === 1 ? "⇄ 切到左支" : "⇄ 切到右支";
                const mathY = -dy / MATH_SCALE;
                dynamicHyperbolaT = Math.asinh(mathY / 3.0);
            } else {
                let dir = 'right';
                if (currentActivePlaneKey === 'pa-left') dir = 'left';
                else if (currentActivePlaneKey === 'pa-up') dir = 'up';
                else if (currentActivePlaneKey === 'pa-down') dir = 'down';

                if (dir === 'right' || dir === 'left') {
                    dynamicParabolaT = Math.max(-4.5, Math.min(4.5, dy / MATH_SCALE));
                } else {
                    dynamicParabolaT = Math.max(-4.5, Math.min(4.5, dx / MATH_SCALE));
                }
            }
        }

        graphDrawCanvas.addEventListener('pointerdown', (e) => {
            if (isPlaneTransitioning) return;
            const pos = getExactPos(graphDrawCanvas, e);
            if (graphTool === 'drag') {
                isDraggingPoint = true;
                try { graphDrawCanvas.setPointerCapture(e.pointerId); } catch(err){}
                handlePointerTrack(e);
            } else {
                isGraphDrawing = true;
                try { graphDrawCanvas.setPointerCapture(e.pointerId); } catch(err){}
                graphStartX = pos.x;
                graphStartY = pos.y;

                if (graphTool === 'line') {
                    graphSnapshot = graphDrawCtx.getImageData(0, 0, graphDrawCanvas.width, graphDrawCanvas.height);
                } else if (graphTool === 'pen') {
                    graphDrawCtx.beginPath();
                    graphDrawCtx.moveTo(pos.x, pos.y);
                }
            }
            e.preventDefault();
        });

        window.addEventListener('pointermove', (e) => {
            if (!isPlaneActive || isPlaneTransitioning) return;

            if (isDraggingPoint && graphTool === 'drag') {
                handlePointerTrack(e);
            } else if (isGraphDrawing && graphTool !== 'drag') {
                const pos = getExactPos(graphDrawCanvas, e);

                if (graphTool === 'pen') {
                    graphDrawCtx.save();
                    graphDrawCtx.strokeStyle = graphColor;
                    graphDrawCtx.lineWidth = 2.6;
                    graphDrawCtx.lineCap = 'round';
                    graphDrawCtx.lineJoin = 'round';
                    graphDrawCtx.lineTo(pos.x, pos.y);
                    graphDrawCtx.stroke();
                    graphDrawCtx.restore();
                } else if (graphTool === 'eraser') {
                    graphDrawCtx.save();
                    graphDrawCtx.globalCompositeOperation = 'destination-out';
                    graphDrawCtx.beginPath();
                    graphDrawCtx.arc(pos.x, pos.y, 14, 0, Math.PI * 2);
                    graphDrawCtx.fill();
                    graphDrawCtx.restore();
                } else if (graphTool === 'line') {
                    if (graphSnapshot) graphDrawCtx.putImageData(graphSnapshot, 0, 0);
                    graphDrawCtx.save();
                    graphDrawCtx.strokeStyle = graphColor;
                    graphDrawCtx.lineWidth = 2.6;
                    graphDrawCtx.lineCap = 'round';
                    graphDrawCtx.beginPath();
                    graphDrawCtx.moveTo(graphStartX, graphStartY);
                    graphDrawCtx.lineTo(pos.x, pos.y);
                    graphDrawCtx.stroke();
                    graphDrawCtx.restore();
                }
            }
        });

        window.addEventListener('pointerup', (e) => {
            isDraggingPoint = false;
            isGraphDrawing = false;
            graphSnapshot = null;
            try { graphDrawCanvas.releasePointerCapture(e.pointerId); } catch(err){}
        });

        const btnGDrag = document.getElementById('btn-graph-drag');
        const btnGPen = document.getElementById('btn-graph-pen');
        const btnGLine = document.getElementById('btn-graph-line');
        const btnGEraser = document.getElementById('btn-graph-eraser');
        const btnGClear = document.getElementById('btn-graph-clear');

        function setGraphTool(tool, btn) {
            graphTool = tool;
            [btnGDrag, btnGPen, btnGLine, btnGEraser].forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (tool === 'drag') graphDrawCanvas.style.cursor = 'grab';
            else graphDrawCanvas.style.cursor = 'crosshair';
        }

        btnGDrag.onclick = () => setGraphTool('drag', btnGDrag);
        btnGPen.onclick = () => setGraphTool('pen', btnGPen);
        btnGLine.onclick = () => setGraphTool('line', btnGLine);
        btnGEraser.onclick = () => setGraphTool('eraser', btnGEraser);

        btnGClear.onclick = clearGraffiti;

        document.querySelectorAll('.g-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.g-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                graphColor = dot.getAttribute('data-color');
                if (graphTool === 'eraser' || graphTool === 'drag') setGraphTool('pen', btnGPen);
            };
        });

        /* ========================================================
           10. 3D 热区拾取逻辑
           ======================================================== */
        function handlePointerTap(clientX, clientY) {
            if (isAnimating || isPlaneActive || isPlaneTransitioning) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (!isBookOpen) {
                const hits = raycaster.intersectObjects([bookCover, bookBase, coverPivot, ...bookGroup.children], true);
                if (hits.length > 0) openBook();
                return;
            }

            // 位于第二页【例题研讨页】时
            if (currentPageIndex === 2) {
                const hits = raycaster.intersectObjects([bookBase], true);
                if (hits.length > 0) {
                    const localPt = bookBase.worldToLocal(hits[0].point.clone());
                    const z = localPt.z;

                    if (z < -1.4) {
                        riseUpPlaneCenter('ex-2', clientX, clientY);
                    } else if (z < 1.6) {
                        riseUpPlaneCenter('ex-1', clientX, clientY);
                    } else {
                        riseUpPlaneCenter('ex-5', clientX, clientY);
                    }
                    return;
                }
            }

            // 位于第一页【概念全景页】时
            const hits = raycaster.intersectObjects([bookBase, bookCover, pageLeafMesh], true);
            if (hits.length > 0) {
                const hitObj = hits[0].object;
                const hitPoint = hits[0].point.clone();

                let isLeftPage = false;
                let curObj = hitObj;
                while (curObj) {
                    if (curObj === coverPivot || curObj === bookCover) {
                        isLeftPage = true;
                        break;
                    }
                    curObj = curObj.parent;
                }
                if (hitPoint.x < -3.5) isLeftPage = true;

                // 左页：双曲线
                if (isLeftPage) {
                    const localPt = bookCover.worldToLocal(hitPoint.clone());
                    if (localPt.z < 0) riseUpPlaneCenter('hyp-def2', clientX, clientY);
                    else riseUpPlaneCenter('hyp-def1', clientX, clientY);
                    return;
                }

                // 右页：椭圆与抛物线
                const localPt = pageLeafMesh.worldToLocal(hitPoint.clone());
                const x = localPt.x;
                const z = localPt.z;

                if (z < 0) {
                    if (z < -2.4) {
                        if (x < 0) riseUpPlaneCenter('el-def', clientX, clientY);
                        else riseUpPlaneCenter('el-graph', clientX, clientY);
                    } else {
                        if (x < 0) riseUpPlaneCenter('el-eq', clientX, clientY);
                        else riseUpPlaneCenter('el-verify', clientX, clientY);
                    }
                } else {
                    if (z < 1.4) {
                        riseUpPlaneCenter('pa-def', clientX, clientY);
                    } else {
                        if (x < -1.75) riseUpPlaneCenter('pa-right', clientX, clientY);
                        else if (x < 0) riseUpPlaneCenter('pa-left', clientX, clientY);
                        else if (x < 1.75) riseUpPlaneCenter('pa-up', clientX, clientY);
                        else riseUpPlaneCenter('pa-down', clientX, clientY);
                    }
                }
            }
        }

        let tapStartX = 0, tapStartY = 0, tapStartTime = 0;
        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;
            tapStartX = e.clientX;
            tapStartY = e.clientY;
            tapStartTime = Date.now();
        }, { passive: true });

        renderer.domElement.addEventListener('pointerup', (e) => {
            if (e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;
            const dist = Math.hypot(e.clientX - tapStartX, e.clientY - tapStartY);
            if (dist < 26 && (Date.now() - tapStartTime) < 500) {
                handlePointerTap(e.clientX, e.clientY);
            }
        }, { passive: true });

        /* ========================================================
           11. 渲染主循环与响应式缩放
           ======================================================== */
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            advanceAutoMotion();
            update2DCanvas();
        }
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (isPlaneActive) {
                resizeCanvases();
            }
        };
    </script>
</body>
</html>
