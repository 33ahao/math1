    <script>
        /* ========================================================
           1. 3D 场景视角控制器
           ======================================================== */
        let controlsEnabled = true;

        class TabletDualTouchControls {
            constructor(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;

                this.target = new THREE.Vector3(0, -0.6, 0);
                this.minDistance = 4.0;
                this.maxDistance = 22.0;

                const offset = new THREE.Vector3().subVectors(this.camera.position, this.target);
                this.radius = offset.length();
                this.theta = Math.atan2(offset.x, offset.z);
                this.phi = Math.acos(Math.max(-1, Math.min(1, offset.y / this.radius)));

                this.targetRadius = this.radius;
                this.targetTheta = this.theta;
                this.targetPhi = this.phi;

                this.isMouseDown = false;
                this.lastX = 0;
                this.lastY = 0;
                this.lastPinchDist = 0;

                this.initListeners();
            }

            initListeners() {
                window.addEventListener('contextmenu', e => e.preventDefault(), { passive: false });

                window.addEventListener('touchstart', (e) => {
                    if (!controlsEnabled || e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;

                    if (e.touches.length === 1) {
                        this.lastX = e.touches[0].clientX;
                        this.lastY = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        this.lastPinchDist = Math.hypot(dx, dy);
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (!controlsEnabled || e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;

                    if (e.touches.length === 1) {
                        const curX = e.touches[0].clientX;
                        const curY = e.touches[0].clientY;
                        const dx = curX - this.lastX;
                        const dy = curY - this.lastY;
                        this.lastX = curX;
                        this.lastY = curY;

                        this.targetTheta -= dx * 0.0055;
                        this.targetPhi -= dy * 0.0055;
                        this.targetPhi = Math.max(0.08, Math.min(Math.PI - 0.08, this.targetPhi));
                    } else if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const dist = Math.hypot(dx, dy);
                        const pinchDelta = dist - this.lastPinchDist;
                        this.lastPinchDist = dist;

                        this.targetRadius -= pinchDelta * 0.025;
                        this.targetRadius = Math.max(this.minDistance, Math.min(this.maxDistance, this.targetRadius));
                    }
                }, { passive: false });

                window.addEventListener('mousedown', (e) => {
                    if (!controlsEnabled || e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;
                    this.isMouseDown = true;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!this.isMouseDown || !controlsEnabled) return;
                    const dx = e.clientX - this.lastX;
                    const dy = e.clientY - this.lastY;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;

                    this.targetTheta -= dx * 0.0055;
                    this.targetPhi -= dy * 0.0055;
                    this.targetPhi = Math.max(0.08, Math.min(Math.PI - 0.08, this.targetPhi));
                });

                window.addEventListener('mouseup', () => { this.isMouseDown = false; });

                window.addEventListener('wheel', (e) => {
                    if (e.target.closest('#modal-wrapper') || !controlsEnabled) return;
                    this.targetRadius += e.deltaY * 0.008;
                    this.targetRadius = Math.max(this.minDistance, Math.min(this.maxDistance, this.targetRadius));
                }, { passive: true });
            }

            update() {
                this.radius += (this.targetRadius - this.radius) * 0.1;
                this.theta += (this.targetTheta - this.theta) * 0.1;
                this.phi += (this.targetPhi - this.phi) * 0.1;

                const sinPhi = Math.sin(this.phi);
                this.camera.position.x = this.target.x + this.radius * sinPhi * Math.sin(this.theta);
                this.camera.position.y = this.target.y + this.radius * Math.cos(this.phi);
                this.camera.position.z = this.target.z + this.radius * sinPhi * Math.cos(this.theta);
                this.camera.lookAt(this.target);
            }
        }

        /* ========================================================
           2. 课本材质：左页双曲线，右页椭圆与抛物线
           ======================================================== */
        function createBookPagesTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 512;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = "#d8caa4"; ctx.fillRect(0, 0, 128, 512);
            for (let y = 0; y < 512; y += 2) {
                const alpha = (Math.sin(y * 0.9) * 0.15 + 0.25) + Math.random() * 0.12;
                ctx.strokeStyle = `rgba(130, 110, 85, ${alpha})`; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(128, y); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(12, 1);
            return tex;
        }

        function createLeftPageHyperbolaTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1440;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#f5efe6";
            ctx.fillRect(0, 0, 1024, 1440);
            ctx.strokeStyle = "#ded1be";
            ctx.lineWidth = 10;
            ctx.strokeRect(25, 25, 974, 1390);

            ctx.fillStyle = "#332314";
            ctx.font = "bold 32px serif";
            ctx.textAlign = "center";
            ctx.fillText("x²/a² - y²/b² = 1 ,  a, b > 0 ,  c² = a² + b² ,  e = c/a", 512, 70);

            // ❶ 第一定义：距离差
            ctx.strokeStyle = "#beab95";
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(50, 95); ctx.lineTo(974, 95); ctx.stroke();

            ctx.fillStyle = "#b43d0e";
            ctx.beginPath(); ctx.arc(80, 140, 22, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 26px 'KaiTi'";
            ctx.fillText("1", 80, 148);

            ctx.fillStyle = "#8a2408";
            ctx.font = "bold 36px 'KaiTi'";
            ctx.textAlign = "left";
            ctx.fillText("第一定义：距离差", 120, 150);

            ctx.save();
            ctx.translate(260, 420);
            ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-200, 0); ctx.lineTo(200, 0); ctx.moveTo(0, -180); ctx.lineTo(0, 180); ctx.stroke();
            ctx.strokeStyle = "#0284c7"; ctx.lineWidth = 4;
            ctx.beginPath();
            for(let y = -160; y <= 160; y+=5) {
                let x = 60 * Math.sqrt(1 + (y*y)/(70*70));
                if (y === -160) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.beginPath();
            for(let y = -160; y <= 160; y+=5) {
                let x = -60 * Math.sqrt(1 + (y*y)/(70*70));
                if (y === -160) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.fillStyle = "#dc2626";
            ctx.beginPath(); ctx.arc(-110, 0, 5, 0, Math.PI*2); ctx.arc(110, 0, 5, 0, Math.PI*2); ctx.fill();
            ctx.font = "bold 18px serif";
            ctx.fillText("F₁", -125, 25); ctx.fillText("F₂", 105, 25);
            ctx.fillText("A₁", -75, 25); ctx.fillText("A₂", 50, 25);
            ctx.fillStyle = "#2563eb";
            ctx.beginPath(); ctx.arc(120, -115, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillText("P", 130, -125);
            ctx.strokeStyle = "#e11d48"; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(-110, 0); ctx.lineTo(120, -115); ctx.stroke();
            ctx.strokeStyle = "#eab308";
            ctx.beginPath(); ctx.moveTo(110, 0); ctx.lineTo(120, -115); ctx.stroke();
            ctx.restore();

            ctx.fillStyle = "#2b1f13";
            ctx.font = "bold 26px 'KaiTi'";

        function processNoteImageToPaper(img, targetMaterial) {
            const canvas = document.createElement('canvas');

            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#dfd3c0"; ctx.lineWidth = 12;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

            if (isAutoPlaying) {
                btnAutoPlay.innerText = "⏸ 暂停运动";
                btnAutoPlay.classList.add('active');
            } else {
                btnAutoPlay.innerText = "▶ 自动运动";
                btnAutoPlay.classList.remove('active');
            }
        }

        btnAutoPlay.onclick = () => {
            isAutoPlaying = !isAutoPlaying;
            updatePlayBtnUI();
        };

        btnToggleTrace.onclick = () => {
            isTraceEnabled = !isTraceEnabled;
            if (isTraceEnabled) {
                btnToggleTrace.innerText = "🪄 轨迹: 开";
                btnToggleTrace.classList.add('active');
            } else {
                btnToggleTrace.innerText = "🪄 轨迹: 关";
                btnToggleTrace.classList.remove('active');
            }
        };

        btnToggleCurve.onclick = () => {
            showBaseCurve = !showBaseCurve;
            if (showBaseCurve) btnToggleCurve.classList.add('active');
            else btnToggleCurve.classList.remove('active');
        };

        btnSwitchBranch.onclick = () => {
            dynamicHyperBranch = dynamicHyperBranch === 1 ? -1 : 1;
            btnSwitchBranch.innerText = dynamicHyperBranch === 1 ? "⇄ 切到左支" : "⇄ 切到右支";
            tracePoints = [];
            update2DCanvas();
        };

        btnClearTrace.onclick = () => {
            tracePoints = [];
        };

        function advanceAutoMotion() {
            if (!isAutoPlaying || !isPlaneActive) return;

            if (currentActivePlaneKey && currentActivePlaneKey.startsWith('el-')) {
                dynamicTheta += 0.022;
                if (dynamicTheta > Math.PI * 2) dynamicTheta -= Math.PI * 2;
            } else if (currentActivePlaneKey && currentActivePlaneKey.startsWith('hyp-')) {
                dynamicHyperbolaT += 0.025 * hyperbolaSpeedDir;
                if (dynamicHyperbolaT > 1.85) {
                    dynamicHyperbolaT = 1.85;
                    hyperbolaSpeedDir = -1;
                } else if (dynamicHyperbolaT < -1.85) {
                    dynamicHyperbolaT = -1.85;
                    hyperbolaSpeedDir = 1;
                }
            } else {
                dynamicParabolaT += 0.07 * parabolaSpeedDir;
                if (dynamicParabolaT > 4.5) {
                    dynamicParabolaT = 4.5;
                    parabolaSpeedDir = -1;
                } else if (dynamicParabolaT < -4.5) {
                    dynamicParabolaT = -4.5;
                    parabolaSpeedDir = 1;
                }
            }
        }

        /* ========================================================
           7. 理论推导面板内容渲染
           ======================================================== */
        function renderPlaneInfo(key) {
            let title = "", tag = "", html = "";

            if (key.startsWith('hyp-')) {
                btnSwitchBranch.style.display = 'block';
                btnSwitchBranch.innerText = dynamicHyperBranch === 1 ? "⇄ 切到左支" : "⇄ 切到右支";
            } else {
                btnSwitchBranch.style.display = 'none';
            }

            if (key === 'el-def') {
                title = "❶ 椭圆的第二定义 · 焦准距比";
                tag = "统一定义 (0 < e < 1)";
                html = `
                    <h3>【核心定义】到焦点与准线的距离比为 e</h3>
                    <div>平面内到定点 $F$ 与到定准线 $l$ 的距离比是常数 $e$ ($0 < e < 1$)。</div>
                    <div class="slider-control-group">
                        <div class="slider-row">
                            <span>调节离心率 $e$:</span>
                            <span id="label-e-val">${paramEllipseE.toFixed(2)}</span>
                        </div>
                        <input type="range" id="slider-e" min="0.25" max="0.88" step="0.01" value="${paramEllipseE}">
                    </div>
                    <div class="formula-highlight">
                        $$\\frac{|PF|}{|PM|} = e = \\frac{c}{a} \\quad (0 < e < 1)$$
                    </div>
                    <div>在左侧点击<b>【▶ 自动运动】</b>并开启<b>【🪄 轨迹: 开】</b>，动点 $P$ 亲手绘制完整椭圆！</div>
                `;
            } else if (key === 'el-graph') {
                title = "❷ 椭圆图形分布 · 焦点与准线";
                tag = "几何特征";
                html = `
                    <h3>【几何特征】准线位置与离心率</h3>
                    <div>右焦点 $F(c,0)$，对应右准线方程为 $x = \\frac{a^2}{c} = \\frac{a}{e}$。</div>
                    <div class="slider-control-group">
                        <div class="slider-row">
                            <span>调节离心率 $e$:</span>
                            <span id="label-e-val">${paramEllipseE.toFixed(2)}</span>
                        </div>
                        <input type="range" id="slider-e" min="0.25" max="0.88" step="0.01" value="${paramEllipseE}">
                    </div>
                    <div class="formula-highlight">
                        $$c = ae, \\quad \\text{准线: } x = \\pm \\frac{a}{e}$$
                    </div>
                `;
            } else if (key === 'el-eq') {
                title = "❸ 椭圆标准方程的代数推导";
                tag = "代数推导";
                html = `
                    <h3>【推导过程】</h3>
                    <div>动点 $P(x,y)$，焦点 $F(c,0)$，准线 $l: x = \\frac{a^2}{c}$：</div>
                    <div class="formula-highlight">
                        $$\\frac{\\sqrt{(x-c)^2 + y^2}}{|x - \\frac{a^2}{c}|} = \\frac{c}{a}$$
                    </div>
                    <div>两边平方展开并代入 $b^2 = a^2 - c^2$，整理即得：</div>
                    <div class="formula-highlight">
                        $$\\frac{x^2}{a^2} + \\frac{y^2}{b^2} = 1 \\quad (a > b > 0)$$
                    </div>
                `;
            } else if (key === 'el-verify') {
                title = "❹ 椭圆特殊点验证 · 顶点极限";
                tag = "端点验证";
                html = `
                    <h3>【长轴端点代数检验】</h3>
                    <div>当动点移动到长轴右端点 $A(a,0)$：<br>
                    • 焦半径：$|PF| = a - c$<br>
                    • 准线距：$|PM| = \\frac{a}{e} - a = \\frac{a - c}{e}$<br>
                    • 距离比：
                    <div class="formula-highlight">
                        $$\\frac{|PF|}{|PM|} = \\frac{a - c}{\\frac{a - c}{e}} = e \\quad \\text{(恒成立)}$$
                    </div>
                `;
            } else if (key === 'hyp-def1') {
                title = "❶ 双曲线第一定义：距离差";
                tag = "定差为 2a";
                html = `
                    <h3>【核心定义】到两焦点距离之差的绝对值为定值</h3>
                    <div>平面内与两个定点 $F_1, F_2$ 的距离的差的绝对值等于常数 $2a$ ($0 < 2a < 2c$)：</div>
                    <div class="formula-highlight">
                        $$|\\,|PF_1| - |PF_2|\\,| = 2a$$
                    </div>
                    <div>• 右支：$|PF_1| - |PF_2| = 2a$<br>
                    • 左支：$|PF_2| - |PF_1| = 2a$</div>
                    <div class="formula-highlight">
                        $$c^2 = a^2 + b^2, \\quad e = \\frac{c}{a} > 1$$
                    </div>
                    <div>点击左侧<b>【⇄ 切换左支】</b>，观察动点在左右两支绘制双曲线！</div>

            } else if (key === 'hyp-def2') {
                title = "❷ 双曲线第二定义：焦准距比";
                tag = "统一定义 (e > 1)";
                html = `
                    <h3>【核心定义】到焦点与准线的距离比为 e > 1</h3>
                    <div>平面内到定点 $F$ 与到定准线 $l$ 的距离比是常数 $e$ ($e > 1$)：</div>
                    <div class="slider-control-group">
                        <div class="slider-row">
                            <span>调节离心率 $e$:</span>
                            <span id="label-h-e-val">${paramHyperbolaE.toFixed(2)}</span>
                        </div>
                        <input type="range" id="slider-he" min="1.15" max="2.6" step="0.05" value="${paramHyperbolaE}">
                    </div>
                    <div class="formula-highlight">
                        $$\\frac{|PF_1|}{|PH_1|} = \\frac{|PF_2|}{|PH_2|} = e = \\frac{c}{a} > 1$$
                    </div>
                    <div>焦点与同侧准线严格对应！可在左侧自由切换左/右支！</div>
                `;
            } else if (key === 'pa-def') {
                title = "一、抛物线的定义";
                tag = "等距性 (e = 1)";
                html = `
                    <h3>【核心定义】焦点与准线等距</h3>
                    <div>平面内到定点 $F$ 和定直线 $l$ 距离相等的点的轨迹。</div>
                    <div class="slider-control-group">
                        <div class="slider-row">
                            <span>调节焦准距 $p$:</span>
                            <span id="label-p-val">${paramParabolaP.toFixed(1)}</span>
                        </div>
                        <input type="range" id="slider-p" min="1.2" max="4.5" step="0.1" value="${paramParabolaP}">
                    </div>
                    <div class="formula-highlight">
                        $$|PF| = |PM| \\iff \\frac{|PF|}{|PM|} = 1$$
                    </div>
                `;
            } else {
                const mapTitles = {
                    'pa-right': '二、抛物线：y² = 2px (向右开口)',
                    'pa-left':  '二、抛物线：y² = -2px (向左开口)',
                    'pa-up':    '二、抛物线：x² = 2py (向上开口)',
                    'pa-down':  '二、抛物线：x² = -2py (向下开口)'
                };
                const mapProps = {
                    'pa-right': { f: '(\\frac{p}{2}, 0)', l: 'x = -\\frac{p}{2}', form: 'y^2 = 2px' },
                    'pa-left':  { f: '(-\\frac{p}{2}, 0)', l: 'x = \\frac{p}{2}', form: 'y^2 = -2px' },
                    'pa-up':    { f: '(0, \\frac{p}{2})', l: 'y = -\\frac{p}{2}', form: 'x^2 = 2py' },
                    'pa-down':  { f: '(0, -\\frac{p}{2})', l: 'y = \\frac{p}{2}', form: 'x^2 = -2py' }
                };
                const prop = mapProps[key] || mapProps['pa-right'];
                title = mapTitles[key];
                tag = "标准方程与性质";
                html = `
                    <h3>【几何性质】焦点与准线</h3>
                    <div>方程：$${prop.form} \\quad (p > 0)$<br>
                    • 焦点坐标：$F${prop.f}$<br>
                    • 准线方程：$${prop.l}$<br>
                    • 焦准距：$p$</div>
                    <div class="slider-control-group">
                        <div class="slider-row">
                            <span>调节参数 $p$:</span>
                            <span id="label-p-val">${paramParabolaP.toFixed(1)}</span>
                        </div>
                        <input type="range" id="slider-p" min="1.2" max="4.5" step="0.1" value="${paramParabolaP}">
                    </div>
                    <div class="formula-highlight">
                        $$|PF| \\equiv |PM|$$
                    </div>
                    <div>拖动或自动运动动点 $P$，实时验证焦半径等于准线距！</div>
                `;
            }

            p2dTitleText.innerText = title;
            p2dTagText.innerText = tag;
            p2dInfoContent.innerHTML = html;

            if (window.renderMathInElement) {
                renderMathInElement(p2dInfoContent, { delimiters: [{left:'$$', right:'$$', display:true}, {left:'$', right:'$', display:false}], throwOnError:false });
            }

            const sE = document.getElementById('slider-e');
            if (sE) sE.oninput = (e) => {
                paramEllipseE = parseFloat(e.target.value);
                const lbl = document.getElementById('label-e-val');
                if (lbl) lbl.innerText = paramEllipseE.toFixed(2);
                tracePoints = [];
            };

            const sHE = document.getElementById('slider-he');
            if (sHE) sHE.oninput = (e) => {
                paramHyperbolaE = parseFloat(e.target.value);
                const lbl = document.getElementById('label-h-e-val');
                if (lbl) lbl.innerText = paramHyperbolaE.toFixed(2);
                tracePoints = [];
            };

            const sP = document.getElementById('slider-p');
            if (sP) sP.oninput = (e) => {
                paramParabolaP = parseFloat(e.target.value);
                const lbl = document.getElementById('label-p-val');
                if (lbl) lbl.innerText = paramParabolaP.toFixed(1);
                tracePoints = [];
            };
        }

        /* ========================================================
           8. 底层几何画板动态渲染 (大视界坐标系)
           ======================================================== */
        function drawCanvasLine(ctx, x1, y1, x2, y2, isDash = false, color = "#261d15", width = 2) {
            ctx.save(); ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width;
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            if (isDash) ctx.setLineDash([7, 5]);
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
        }

        function drawCanvasText(ctx, text, x, y, color = "#261d15", font = "bold 15px 'KaiTi'") {
            ctx.save(); ctx.font = font; ctx.fillStyle = color; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, x, y); ctx.restore();
        }

        function update2DCanvas() {
            if (!isPlaneActive) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
            const w = p2dCanvas.width / dpr;
            const h = p2dCanvas.height / dpr;

            p2dCtx.clearRect(0, 0, w, h);

            p2dCtx.save();
            p2dCtx.strokeStyle = "#f3f4f6";
            p2dCtx.lineWidth = 1;
            for (let x = 0; x < w; x += 32) { p2dCtx.beginPath(); p2dCtx.moveTo(x, 0); p2dCtx.lineTo(x, h); p2dCtx.stroke(); }
            for (let y = 0; y < h; y += 32) { p2dCtx.beginPath(); p2dCtx.moveTo(0, y); p2dCtx.lineTo(w, y); p2dCtx.stroke(); }
            p2dCtx.restore();

            const cx = w * 0.48, cy = h * 0.5;

            p2dCtx.strokeStyle = "#94a3b8"; p2dCtx.lineWidth = 1.6;
            drawCanvasLine(p2dCtx, 20, cy, w - 20, cy);
            drawCanvasLine(p2dCtx, cx, 20, cx, h - 20);
            drawCanvasText(p2dCtx, "O", cx - 14, cy + 15, "#64748b", "bold 15px 'KaiTi'");
            drawCanvasText(p2dCtx, "x", w - 14, cy + 15, "#64748b", "bold 15px sans-serif");
            drawCanvasText(p2dCtx, "y", cx + 15, 16, "#64748b", "bold 15px sans-serif");

            if (tracePoints.length > 1) {
                p2dCtx.save();
                p2dCtx.strokeStyle = "rgba(180, 61, 14, 0.82)";
                p2dCtx.lineWidth = 3.5;
                p2dCtx.lineCap = 'round';
                p2dCtx.lineJoin = 'round';
                p2dCtx.beginPath();
                for (let i = 0; i < tracePoints.length; i++) {
                    if (i === 0) {
                        p2dCtx.moveTo(tracePoints[i].x, tracePoints[i].y);
                    } else {
                        const dist = Math.hypot(tracePoints[i].x - tracePoints[i-1].x, tracePoints[i].y - tracePoints[i-1].y);
                        if (dist > 38) {
                            p2dCtx.moveTo(tracePoints[i].x, tracePoints[i].y);
                        } else {
                            p2dCtx.lineTo(tracePoints[i].x, tracePoints[i].y);
                        }
                    }
                }
                p2dCtx.stroke();
                p2dCtx.restore();
            }

            // ==================== 1. 椭圆体系 ====================
            if (currentActivePlaneKey && currentActivePlaneKey.startsWith('el-')) {
                const mathA = 5.6; 
                const mathE = paramEllipseE;
                const mathC = mathA * mathE;
                const mathB = Math.sqrt(mathA * mathA - mathC * mathC);
                const mathDirX = mathA / mathE;

                const aPx = mathA * MATH_SCALE;
                const bPx = mathB * MATH_SCALE;
                const cPx = mathC * MATH_SCALE;
                const dirXPx = mathDirX * MATH_SCALE;

                if (showBaseCurve) {
                    p2dCtx.save();
                    p2dCtx.beginPath();
                    p2dCtx.strokeStyle = "#0284c7";
                    p2dCtx.lineWidth = 3.2;
                    p2dCtx.ellipse(cx, cy, aPx, bPx, 0, 0, Math.PI * 2);
                    p2dCtx.stroke();
                    p2dCtx.restore();
                }

                drawCanvasLine(p2dCtx, cx + dirXPx, 25, cx + dirXPx, h - 25, true, "#d97706", 2.2);
                drawCanvasText(p2dCtx, `准线 x = a²/c`, cx + dirXPx, 16, "#d97706", "bold 14px 'KaiTi'");

                p2dCtx.fillStyle = "#dc2626";
                p2dCtx.beginPath(); p2dCtx.arc(cx + cPx, cy, 5.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "F(c,0)", cx + cPx, cy + 18, "#dc2626", "bold 15px 'KaiTi'");

                const px = cx + aPx * Math.cos(dynamicTheta);
                const py = cy - bPx * Math.sin(dynamicTheta);
                const mx = cx + dirXPx;
                const my = py;

                if (isTraceEnabled) {
                    tracePoints.push({ x: px, y: py });
                    if (tracePoints.length > 500) tracePoints.shift();
                }

                drawCanvasLine(p2dCtx, px, py, cx + cPx, cy, false, "#dc2626", 2.6);
                drawCanvasLine(p2dCtx, px, py, mx, my, true, "#059669", 2.6);

                p2dCtx.fillStyle = "#059669";
                p2dCtx.beginPath(); p2dCtx.arc(mx, my, 4.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "M", mx + 14, my, "#059669", "bold 15px 'KaiTi'");

                p2dCtx.fillStyle = "#2563eb";
                p2dCtx.beginPath(); p2dCtx.arc(px, py, 8, 0, Math.PI * 2); p2dCtx.fill();
                p2dCtx.strokeStyle = "#ffffff"; p2dCtx.lineWidth = 2.5; p2dCtx.stroke();
                drawCanvasText(p2dCtx, "P", px, py - 18, "#1e3a8a", "bold 15px 'KaiTi'");

                const realDistPF = Math.hypot(px - (cx + cPx), py - cy) / MATH_SCALE;
                const realDistPM = Math.abs(mx - px) / MATH_SCALE;
                const realRatio = realDistPF / realDistPM;

                p2dCtx.fillStyle = "rgba(255,255,255,0.94)";
                p2dCtx.fillRect(25, 25, 210, 75);
                p2dCtx.strokeStyle = "#cbd5e1"; p2dCtx.strokeRect(25, 25, 210, 75);
                drawCanvasText(p2dCtx, `焦半径 |PF| = ${realDistPF.toFixed(2)}`, 130, 42, "#dc2626", "bold 14px monospace");
                drawCanvasText(p2dCtx, `准线距 |PM| = ${realDistPM.toFixed(2)}`, 130, 62, "#059669", "bold 14px monospace");
                drawCanvasText(p2dCtx, `比值 e ≡ ${(realRatio).toFixed(2)}`, 130, 82, "#0284c7", "bold 15px monospace");

            // ==================== 2. 双曲线体系 ====================
            } else if (currentActivePlaneKey && currentActivePlaneKey.startsWith('hyp-')) {
                const mathA = 3.5;
                const mathE = paramHyperbolaE;
                const mathC = mathA * mathE;
                const mathB = Math.sqrt(mathC * mathC - mathA * mathA);
                const mathDirX = mathA / mathE;

                const aPx = mathA * MATH_SCALE;
                const bPx = mathB * MATH_SCALE;
                const cPx = mathC * MATH_SCALE;
                const dirXPx = mathDirX * MATH_SCALE;

                if (showBaseCurve) {
                    p2dCtx.save();
                    p2dCtx.strokeStyle = "#cbd5e1"; p2dCtx.lineWidth = 1.5; p2dCtx.setLineDash([5, 5]);
                    const k = bPx / aPx;
                    p2dCtx.beginPath();
                    p2dCtx.moveTo(cx - 300, cy - 300 * k); p2dCtx.lineTo(cx + 300, cy + 300 * k);
                    p2dCtx.moveTo(cx - 300, cy + 300 * k); p2dCtx.lineTo(cx + 300, cy - 300 * k);
                    p2dCtx.stroke();
                    p2dCtx.restore();

                    p2dCtx.save();
                    p2dCtx.strokeStyle = "#0284c7";
                    p2dCtx.lineWidth = 3.2;
                    p2dCtx.beginPath();
                    for (let t = -2.2; t <= 2.2; t += 0.05) {
                        const rx = cx + aPx * Math.cosh(t);
                        const ry = cy - bPx * Math.sinh(t);
                        if (t === -2.2) p2dCtx.moveTo(rx, ry); else p2dCtx.lineTo(rx, ry);
                    }
                    p2dCtx.stroke();
                    p2dCtx.beginPath();
                    for (let t = -2.2; t <= 2.2; t += 0.05) {
                        const lx = cx - aPx * Math.cosh(t);
                        const ly = cy - bPx * Math.sinh(t);
                        if (t === -2.2) p2dCtx.moveTo(lx, ly); else p2dCtx.lineTo(lx, ly);
                    }
                    p2dCtx.stroke();
                    p2dCtx.restore();
                }

                p2dCtx.fillStyle = "#dc2626";
                p2dCtx.beginPath(); p2dCtx.arc(cx - cPx, cy, 5.5, 0, Math.PI * 2); p2dCtx.fill();
                p2dCtx.beginPath(); p2dCtx.arc(cx + cPx, cy, 5.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "F₁", cx - cPx, cy + 18, "#dc2626", "bold 15px 'KaiTi'");
                drawCanvasText(p2dCtx, "F₂", cx + cPx, cy + 18, "#dc2626", "bold 15px 'KaiTi'");

                const px = cx + dynamicHyperBranch * aPx * Math.cosh(dynamicHyperbolaT);
                const py = cy - bPx * Math.sinh(dynamicHyperbolaT);

                if (isTraceEnabled) {
                    tracePoints.push({ x: px, y: py });
                    if (tracePoints.length > 500) tracePoints.shift();
                }

                p2dCtx.fillStyle = "#2563eb";
                p2dCtx.beginPath(); p2dCtx.arc(px, py, 8, 0, Math.PI * 2); p2dCtx.fill();
                p2dCtx.strokeStyle = "#ffffff"; p2dCtx.lineWidth = 2.5; p2dCtx.stroke();
                drawCanvasText(p2dCtx, "P", px + (dynamicHyperBranch > 0 ? 16 : -16), py - 14, "#1e3a8a", "bold 15px 'KaiTi'");

                if (currentActivePlaneKey === 'hyp-def1') {
                    drawCanvasLine(p2dCtx, px, py, cx - cPx, cy, false, "#e11d48", 2.6);
                    drawCanvasLine(p2dCtx, px, py, cx + cPx, cy, false, "#eab308", 2.6);

                    const d1 = Math.hypot(px - (cx - cPx), py - cy) / MATH_SCALE;
                    const d2 = Math.hypot(px - (cx + cPx), py - cy) / MATH_SCALE;
                    const diff = Math.abs(d1 - d2);

                    p2dCtx.fillStyle = "rgba(255,255,255,0.94)";
                    p2dCtx.fillRect(25, 25, 230, 75);
                    p2dCtx.strokeStyle = "#cbd5e1"; p2dCtx.strokeRect(25, 25, 230, 75);
                    drawCanvasText(p2dCtx, `|PF₁| = ${d1.toFixed(2)}`, 140, 42, "#e11d48", "bold 14px monospace");
                    drawCanvasText(p2dCtx, `|PF₂| = ${d2.toFixed(2)}`, 140, 62, "#d97706", "bold 14px monospace");
                    drawCanvasText(p2dCtx, `距离差 ||PF₁|-|PF₂|| ≡ ${diff.toFixed(2)} (2a)`, 140, 82, "#0284c7", "bold 13px monospace");
                } else {
                    drawCanvasLine(p2dCtx, cx - dirXPx, 25, cx - dirXPx, h - 25, true, "#d97706", 2.0);
                    drawCanvasLine(p2dCtx, cx + dirXPx, 25, cx + dirXPx, h - 25, true, "#d97706", 2.0);
                    drawCanvasText(p2dCtx, "x=-a²/c", cx - dirXPx, 16, "#d97706", "bold 13px 'KaiTi'");
                    drawCanvasText(p2dCtx, "x=a²/c", cx + dirXPx, 16, "#d97706", "bold 13px 'KaiTi'");

                    const activeFocusX = dynamicHyperBranch > 0 ? cx + cPx : cx - cPx;
                    const activeDirX = dynamicHyperBranch > 0 ? cx + dirXPx : cx - dirXPx;

                    drawCanvasLine(p2dCtx, px, py, activeFocusX, cy, false, "#dc2626", 2.6);
                    drawCanvasLine(p2dCtx, px, py, activeDirX, py, true, "#059669", 2.6);

                    p2dCtx.fillStyle = "#059669";
                    p2dCtx.beginPath(); p2dCtx.arc(activeDirX, py, 4.5, 0, Math.PI * 2); p2dCtx.fill();
                    drawCanvasText(p2dCtx, "H", activeDirX + (dynamicHyperBranch > 0 ? -14 : 14), py - 10, "#059669", "bold 15px 'KaiTi'");

                    const realPF = Math.hypot(px - activeFocusX, py - cy) / MATH_SCALE;
                    const realPH = Math.abs(activeDirX - px) / MATH_SCALE;
                    const ratio = realPF / realPH;

                    p2dCtx.fillStyle = "rgba(255,255,255,0.94)";
                    p2dCtx.fillRect(25, 25, 220, 75);
                    p2dCtx.strokeStyle = "#cbd5e1"; p2dCtx.strokeRect(25, 25, 220, 75);
                    drawCanvasText(p2dCtx, `焦半径 |PF| = ${realPF.toFixed(2)}`, 135, 42, "#dc2626", "bold 14px monospace");
                    drawCanvasText(p2dCtx, `准线距 |PH| = ${realPH.toFixed(2)}`, 135, 62, "#059669", "bold 14px monospace");
                    drawCanvasText(p2dCtx, `比值 e ≡ ${(ratio).toFixed(2)} (>1)`, 135, 82, "#0284c7", "bold 14px monospace");
                }

            // ==================== 3. 抛物线体系 ====================
            } else {
                const mathP = paramParabolaP;
                const pPx = mathP * MATH_SCALE;
                let dir = 'right';
                if (currentActivePlaneKey === 'pa-left') dir = 'left';
                else if (currentActivePlaneKey === 'pa-up') dir = 'up';
                else if (currentActivePlaneKey === 'pa-down') dir = 'down';

                if (showBaseCurve) {
                    p2dCtx.save();
                    p2dCtx.strokeStyle = "#0284c7";
                    p2dCtx.lineWidth = 3.2;
                    p2dCtx.beginPath();
                    const span = 5.2;
                    for (let t = -span; t <= span; t += 0.1) {
                        let rx = 0, ry = 0;
                        if (dir === 'right') { rx = cx + ((t*t)/(2*mathP)) * MATH_SCALE; ry = cy + t * MATH_SCALE; }
                        else if (dir === 'left') { rx = cx - ((t*t)/(2*mathP)) * MATH_SCALE; ry = cy + t * MATH_SCALE; }
                        else if (dir === 'up') { rx = cx + t * MATH_SCALE; ry = cy - ((t*t)/(2*mathP)) * MATH_SCALE; }
                        else { rx = cx + t * MATH_SCALE; ry = cy + ((t*t)/(2*mathP)) * MATH_SCALE; }
                        if (t === -span) p2dCtx.moveTo(rx, ry); else p2dCtx.lineTo(rx, ry);
                    }
                    p2dCtx.stroke();
                    p2dCtx.restore();
                }

                let fx = cx, fy = cy, lx1 = 0, ly1 = 0, lx2 = 0, ly2 = 0;
                if (dir === 'right') {
                    fx = cx + pPx/2; fy = cy;
                    lx1 = cx - pPx/2; ly1 = 25; lx2 = cx - pPx/2; ly2 = h - 25;
                } else if (dir === 'left') {
                    fx = cx - pPx/2; fy = cy;
                    lx1 = cx + pPx/2; ly1 = 25; lx2 = cx + pPx/2; ly2 = h - 25;
                } else if (dir === 'up') {
                    fx = cx; fy = cy - pPx/2;
                    lx1 = 25; ly1 = cy + pPx/2; lx2 = w - 25; ly2 = cy + pPx/2;
                } else {
                    fx = cx; fy = cy + pPx/2;
                    lx1 = 25; ly1 = cy - pPx/2; lx2 = w - 25; ly2 = cy - pPx/2;
                }

                drawCanvasLine(p2dCtx, lx1, ly1, lx2, ly2, true, "#d97706", 2.2);
                drawCanvasText(p2dCtx, "准线 l", dir === 'up' || dir === 'down' ? w - 25 : lx1, dir === 'up' || dir === 'down' ? ly1 - 14 : 16, "#d97706", "bold 14px 'KaiTi'");

                p2dCtx.fillStyle = "#dc2626"; p2dCtx.beginPath(); p2dCtx.arc(fx, fy, 5.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "F", fx + 14, fy + 14, "#dc2626", "bold 15px 'KaiTi'");

                const tVal = dynamicParabolaT;
                let px = 0, py = 0, mx = 0, my = 0;
                if (dir === 'right') {
                    px = cx + ((tVal*tVal)/(2*mathP)) * MATH_SCALE; py = cy + tVal * MATH_SCALE;
                    mx = cx - pPx/2; my = py;
                } else if (dir === 'left') {
                    px = cx - ((tVal*tVal)/(2*mathP)) * MATH_SCALE; py = cy + tVal * MATH_SCALE;
                    mx = cx + pPx/2; my = py;
                } else if (dir === 'up') {
                    px = cx + tVal * MATH_SCALE; py = cy - ((tVal*tVal)/(2*mathP)) * MATH_SCALE;
                    mx = px; my = cy + pPx/2;
                } else {
                    px = cx + tVal * MATH_SCALE; py = cy + ((tVal*tVal)/(2*mathP)) * MATH_SCALE;
                    mx = px; my = cy - pPx/2;
                }

                if (isTraceEnabled) {
                    tracePoints.push({ x: px, y: py });
                    if (tracePoints.length > 500) tracePoints.shift();
                }

                drawCanvasLine(p2dCtx, px, py, fx, fy, false, "#dc2626", 2.6);
                drawCanvasLine(p2dCtx, px, py, mx, my, true, "#059669", 2.6);

                p2dCtx.fillStyle = "#059669"; p2dCtx.beginPath(); p2dCtx.arc(mx, my, 4.5, 0, Math.PI * 2); p2dCtx.fill();
                drawCanvasText(p2dCtx, "M", mx + 14, my - 8, "#059669", "bold 14px 'KaiTi'");

                p2dCtx.fillStyle = "#2563eb"; p2dCtx.beginPath(); p2dCtx.arc(px, py, 8, 0, Math.PI * 2); p2dCtx.fill();
                p2dCtx.strokeStyle = "#ffffff"; p2dCtx.lineWidth = 2.5; p2dCtx.stroke();
                drawCanvasText(p2dCtx, "P", px + 16, py - 16, "#1e3a8a", "bold 15px 'KaiTi'");

                const realD1 = Math.hypot(px - fx, py - fy) / MATH_SCALE;
                const realD2 = Math.hypot(px - mx, py - my) / MATH_SCALE;

                p2dCtx.fillStyle = "rgba(255,255,255,0.94)"; p2dCtx.fillRect(25, 25, 210, 70);
                p2dCtx.strokeStyle = "#cbd5e1"; p2dCtx.strokeRect(25, 25, 210, 70);
                drawCanvasText(p2dCtx, `焦半径 |PF| = ${realD1.toFixed(2)}`, 130, 45, "#dc2626", "bold 14px monospace");
                drawCanvasText(p2dCtx, `准线距 |PM| = ${realD2.toFixed(2)}`, 130, 68, "#059669", "bold 14px monospace");
            }
        }

        /* ========================================================
           9. 动点手动拖拽与图形标注涂鸦系统
           ======================================================== */
        let graphTool = 'drag';
        let graphColor = '#dc2626';
        let isGraphDrawing = false;
        let graphStartX = 0, graphStartY = 0;
        let graphSnapshot = null;

        function getExactPos(canvas, e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function handlePointerTrack(e) {
            const rect = canvasInteractiveArea.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
            const w = p2dCanvas.width / dpr;
            const h = p2dCanvas.height / dpr;

            const mouseCanvasX = (e.clientX - rect.left);
            const mouseCanvasY = (e.clientY - rect.top);
            const cx = w * 0.48;
            const cy = h * 0.5;

            const dx = mouseCanvasX - cx;
            const dy = mouseCanvasY - cy;

            if (currentActivePlaneKey && currentActivePlaneKey.startsWith('el-')) {
                dynamicTheta = Math.atan2(-dy, dx);
            } else if (currentActivePlaneKey && currentActivePlaneKey.startsWith('hyp-')) {
                dynamicHyperBranch = dx >= 0 ? 1 : -1;
                btnSwitchBranch.innerText = dynamicHyperBranch === 1 ? "⇄ 切到左支" : "⇄ 切到右支";
                const mathY = -dy / MATH_SCALE;
                dynamicHyperbolaT = Math.asinh(mathY / 3.0);
            } else {
                let dir = 'right';
                if (currentActivePlaneKey === 'pa-left') dir = 'left';
                else if (currentActivePlaneKey === 'pa-up') dir = 'up';
                else if (currentActivePlaneKey === 'pa-down') dir = 'down';

                if (dir === 'right' || dir === 'left') {
                    dynamicParabolaT = Math.max(-4.5, Math.min(4.5, dy / MATH_SCALE));
                } else {
                    dynamicParabolaT = Math.max(-4.5, Math.min(4.5, dx / MATH_SCALE));
                }
            }
        }

        graphDrawCanvas.addEventListener('pointerdown', (e) => {
            const pos = getExactPos(graphDrawCanvas, e);
            if (graphTool === 'drag') {
                isDraggingPoint = true;
                try { graphDrawCanvas.setPointerCapture(e.pointerId); } catch(err){}
                handlePointerTrack(e);
            } else {
                isGraphDrawing = true;
                try { graphDrawCanvas.setPointerCapture(e.pointerId); } catch(err){}
                graphStartX = pos.x;
                graphStartY = pos.y;

                if (graphTool === 'line') {
                    graphSnapshot = graphDrawCtx.getImageData(0, 0, graphDrawCanvas.width, graphDrawCanvas.height);
                } else if (graphTool === 'pen') {
                    graphDrawCtx.beginPath();
                    graphDrawCtx.moveTo(pos.x, pos.y);
                }
            }
            e.preventDefault();
        });

        window.addEventListener('pointermove', (e) => {
            if (!isPlaneActive) return;

            if (isDraggingPoint && graphTool === 'drag') {
                handlePointerTrack(e);
            } else if (isGraphDrawing && graphTool !== 'drag') {
                const pos = getExactPos(graphDrawCanvas, e);

                if (graphTool === 'pen') {
                    graphDrawCtx.save();
                    graphDrawCtx.strokeStyle = graphColor;
                    graphDrawCtx.lineWidth = 2.6;
                    graphDrawCtx.lineCap = 'round';
                    graphDrawCtx.lineJoin = 'round';
                    graphDrawCtx.lineTo(pos.x, pos.y);
                    graphDrawCtx.stroke();
                    graphDrawCtx.restore();
                } else if (graphTool === 'eraser') {
                    graphDrawCtx.save();
                    graphDrawCtx.globalCompositeOperation = 'destination-out';
                    graphDrawCtx.beginPath();
                    graphDrawCtx.arc(pos.x, pos.y, 14, 0, Math.PI * 2);
                    graphDrawCtx.fill();
                    graphDrawCtx.restore();
                } else if (graphTool === 'line') {
                    if (graphSnapshot) graphDrawCtx.putImageData(graphSnapshot, 0, 0);
                    graphDrawCtx.save();
                    graphDrawCtx.strokeStyle = graphColor;
                    graphDrawCtx.lineWidth = 2.6;
                    graphDrawCtx.lineCap = 'round';
                    graphDrawCtx.beginPath();
                    graphDrawCtx.moveTo(graphStartX, graphStartY);
                    graphDrawCtx.lineTo(pos.x, pos.y);
                    graphDrawCtx.stroke();
                    graphDrawCtx.restore();
                }
            }
        });

        window.addEventListener('pointerup', (e) => {
            isDraggingPoint = false;
            isGraphDrawing = false;
            graphSnapshot = null;
            try { graphDrawCanvas.releasePointerCapture(e.pointerId); } catch(err){}
        });

        const btnGDrag = document.getElementById('btn-graph-drag');
        const btnGPen = document.getElementById('btn-graph-pen');
        const btnGLine = document.getElementById('btn-graph-line');
        const btnGEraser = document.getElementById('btn-graph-eraser');
        const btnGClear = document.getElementById('btn-graph-clear');

        function setGraphTool(tool, btn) {
            graphTool = tool;
            [btnGDrag, btnGPen, btnGLine, btnGEraser].forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (tool === 'drag') graphDrawCanvas.style.cursor = 'grab';
            else graphDrawCanvas.style.cursor = 'crosshair';
        }

        btnGDrag.onclick = () => setGraphTool('drag', btnGDrag);
        btnGPen.onclick = () => setGraphTool('pen', btnGPen);
        btnGLine.onclick = () => setGraphTool('line', btnGLine);
        btnGEraser.onclick = () => setGraphTool('eraser', btnGEraser);

        btnGClear.onclick = () => {
            const rect = canvasInteractiveArea.getBoundingClientRect();
            graphDrawCtx.clearRect(0, 0, rect.width, rect.height);
        };

        document.querySelectorAll('.g-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.g-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                graphColor = dot.getAttribute('data-color');
                if (graphTool === 'eraser' || graphTool === 'drag') setGraphTool('pen', btnGPen);
            };
        });

        /* ========================================================
           10. 知识点热区拾取
           ======================================================== */
        function handlePointerTap(clientX, clientY) {
            if (isAnimating || isPlaneActive || isPlaneTransitioning) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (!isBookOpen) {
                const hits = raycaster.intersectObjects([bookCover, bookBase, coverPivot, ...bookGroup.children], true);
                if (hits.length > 0) openBook();
                return;
            }

            const hits = raycaster.intersectObjects([bookBase, bookCover], true);
            if (hits.length > 0) {
                const hitObj = hits[0].object;
                const hitPoint = hits[0].point.clone();

                let isLeftPage = false;
                let curObj = hitObj;
                while (curObj) {
                    if (curObj === coverPivot || curObj === bookCover) {
                        isLeftPage = true;
                        break;
                    }
                    curObj = curObj.parent;
                }
                if (hitPoint.x < -3.5) isLeftPage = true;

                // 左侧页：双曲线
                if (isLeftPage) {
                    const localPt = bookCover.worldToLocal(hitPoint.clone());
                    if (localPt.z < 0) {
                        riseUpPlaneCenter('hyp-def2', clientX, clientY);
                    } else {
                        riseUpPlaneCenter('hyp-def1', clientX, clientY);
                    }
                    return;
                }

                // 右侧页：椭圆与抛物线
                const localPt = bookBase.worldToLocal(hitPoint.clone());
                const x = localPt.x;
                const z = localPt.z;

                if (z < 0) {
                    if (z < -2.4) {
                        if (x < 0) riseUpPlaneCenter('el-def', clientX, clientY);
                        else riseUpPlaneCenter('el-graph', clientX, clientY);
                    } else {
                        if (x < 0) riseUpPlaneCenter('el-eq', clientX, clientY);
                        else riseUpPlaneCenter('el-verify', clientX, clientY);
                    }
                } 
                else {
                    if (z < 1.4) {
                        riseUpPlaneCenter('pa-def', clientX, clientY);
                    } else {
                        if (x < -1.75) {
                            riseUpPlaneCenter('pa-right', clientX, clientY);
                        } else if (x < 0) {
                            riseUpPlaneCenter('pa-left', clientX, clientY);
                        } else if (x < 1.75) {
                            riseUpPlaneCenter('pa-up', clientX, clientY);
                        } else {
                            riseUpPlaneCenter('pa-down', clientX, clientY);
                        }
                    }
                }
            }
        }

        let tapStartX = 0, tapStartY = 0, tapStartTime = 0;
        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;
            tapStartX = e.clientX;
            tapStartY = e.clientY;
            tapStartTime = Date.now();
        }, { passive: true });

        renderer.domElement.addEventListener('pointerup', (e) => {
            if (e.target.closest('#top-left-bar') || e.target.closest('#modal-wrapper')) return;
            const dist = Math.hypot(e.clientX - tapStartX, e.clientY - tapStartY);
            if (dist < 26 && (Date.now() - tapStartTime) < 500) {
                handlePointerTap(e.clientX, e.clientY);
            }
        }, { passive: true });

        /* ========================================================
           11. 渲染主循环与视口自适应
           ======================================================== */
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            advanceAutoMotion();
            update2DCanvas();
        }
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (isPlaneActive) {
                if (isGraphFullscreen) {
                    p2dCanvasBox.style.width = window.innerWidth + 'px';
                    p2dCanvasBox.style.height = (window.innerHeight - 52) + 'px';
                }
                resizeCanvases();
            }
        };
    </script>
</body>
