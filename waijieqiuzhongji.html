<body>

    <!-- 左上角：合上课本按钮 -->

        <div class="panel-header">
            <span class="panel-title" id="m-title">模型推导探究</span>
            <div class="header-actions">
                <button class="btn-box-toggle" id="btn-toggle-box">📦 补形</button>
                <button class="btn-back" id="btn-return">放回书本 ↩</button>

    <div id="canvas-container"></div>

    <script>
        /* ========================================================
           1. 触控控制器
           ======================================================== */
        let controlsEnabled = true;

        class TabletDualTouchControls {
            constructor(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;

                this.target = new THREE.Vector3(0, -0.6, 0);
                this.defaultTarget = this.target.clone();
                this.minDistance = 3.5;
                this.maxDistance = 24.0;

                const offset = new THREE.Vector3().subVectors(this.camera.position, this.target);
                this.radius = offset.length();
                this.theta = Math.atan2(offset.x, offset.z);
                this.phi = Math.acos(Math.max(-1, Math.min(1, offset.y / this.radius)));

                this.targetRadius = this.radius;
                this.targetTheta = this.theta;
                this.targetPhi = this.phi;

                this.isMouseDown = false;
                this.mouseButton = 0;
                this.lastX = 0;
                this.lastY = 0;

                this.lastPinchDist = 0;
                this.lastMidX = 0;
                this.lastMidY = 0;

                this.initListeners();
            }

            pan(deltaX, deltaY) {
                const right = new THREE.Vector3();
                const up = new THREE.Vector3();
                this.camera.matrix.extractBasis(right, up, new THREE.Vector3());

                const factor = (2 * Math.tan((this.camera.fov * Math.PI / 180) / 2) * this.radius) / window.innerHeight;
                right.multiplyScalar(-deltaX * factor);
                up.multiplyScalar(deltaY * factor);

                this.target.add(right);
                this.target.add(up);
            }

            initListeners() {
                window.addEventListener('contextmenu', e => e.preventDefault(), { passive: false });

                window.addEventListener('touchstart', (e) => {
                    if (currentDrawMode !== 'orbit') return;
                    if (e.target.closest('#side-panel') || e.target.closest('#paint-toolbar-wrapper') || e.target.closest('#page-nav-bar') || e.target.closest('#top-left-bar')) return;

                    if (e.touches.length === 1) {
                        this.lastX = e.touches[0].clientX;
                        this.lastY = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        this.lastPinchDist = Math.hypot(dx, dy);
                        this.lastMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                        this.lastMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (currentDrawMode !== 'orbit') return;
                    if (e.target.closest('#side-panel') || e.target.closest('#top-left-bar')) return;

                    if (e.touches.length === 1 && controlsEnabled) {
                        const curX = e.touches[0].clientX;
                        const curY = e.touches[0].clientY;
                        const dx = curX - this.lastX;
                        const dy = curY - this.lastY;
                        this.lastX = curX;
                        this.lastY = curY;

                        this.targetTheta -= dx * 0.0055;
                        this.targetPhi -= dy * 0.0055;
                        this.targetPhi = Math.max(0.05, Math.min(Math.PI - 0.05, this.targetPhi));
                    } else if (e.touches.length === 2) {
                        const curMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                        const curMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                        const panDx = curMidX - this.lastMidX;
                        const panDy = curMidY - this.lastMidY;
                        this.lastMidX = curMidX;
                        this.lastMidY = curMidY;

                        this.pan(panDx, panDy);

                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const dist = Math.hypot(dx, dy);
                        const pinchDelta = dist - this.lastPinchDist;
                        this.lastPinchDist = dist;

                        if (activeModel) {
                            applyModelScale(modelScaleFactor + pinchDelta * 0.005);
                        } else {
                            this.targetRadius -= pinchDelta * 0.025;
                            this.targetRadius = Math.max(this.minDistance, Math.min(this.maxDistance, this.targetRadius));
                        }
                    }
                }, { passive: false });

                window.addEventListener('mousedown', (e) => {
                    if (currentDrawMode !== 'orbit' || !controlsEnabled || e.target.closest('#side-panel') || e.target.closest('#paint-toolbar-wrapper') || e.target.closest('#page-nav-bar') || e.target.closest('#top-left-bar')) return;
                    this.isMouseDown = true;
                    this.mouseButton = e.button;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!this.isMouseDown || currentDrawMode !== 'orbit') return;
                    const dx = e.clientX - this.lastX;
                    const dy = e.clientY - this.lastY;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;

                    if (this.mouseButton === 0 && controlsEnabled) {
                        this.targetTheta -= dx * 0.0055;
                        this.targetPhi -= dy * 0.0055;
                        this.targetPhi = Math.max(0.05, Math.min(Math.PI - 0.05, this.targetPhi));
                    } else if (this.mouseButton === 2) {
                        this.pan(dx, dy);
                    }
                });

                window.addEventListener('mouseup', () => { this.isMouseDown = false; });

                window.addEventListener('wheel', (e) => {
                    if (e.target.closest('#side-panel') || currentDrawMode !== 'orbit') return;
                    if (activeModel) {
                        applyModelScale(modelScaleFactor - e.deltaY * 0.002);
                        return;
                    }
                    this.targetRadius += e.deltaY * 0.008;
                    this.targetRadius = Math.max(this.minDistance, Math.min(this.maxDistance, this.targetRadius));
                }, { passive: true });
            }

            resetPan() {
                gsap.to(this.target, {
                    x: this.defaultTarget.x,
                    y: this.defaultTarget.y,
                    z: this.defaultTarget.z,
                    duration: 0.6,
                    ease: "power2.out"
                });
            }

            update() {
                this.radius += (this.targetRadius - this.radius) * 0.1;
                this.theta += (this.targetTheta - this.theta) * 0.1;
                this.phi += (this.targetPhi - this.phi) * 0.1;

                const sinPhi = Math.sin(this.phi);
                this.camera.position.x = this.target.x + this.radius * sinPhi * Math.sin(this.theta);
                this.camera.position.y = this.target.y + this.radius * Math.cos(this.phi);
                this.camera.position.z = this.target.z + this.radius * sinPhi * Math.cos(this.theta);
                this.camera.lookAt(this.target);
            }
        }

        /* ========================================================
           2. 核心数学模型数据
           ======================================================== */
        const MODEL_DATA = [
            {
                id: 0, page: 1,
                name: "模型一：直棱柱外接球模型",
                desc: "底面外接圆半径为 r，直棱柱高为 h",
                formula: "(2R)^2 = (2r)^2 + h^2 \\implies R = \\sqrt{r^2 + \\left(\\frac{h}{2}\\right)^2}",
                derivation: `
                    <h4>【原理】上下底面外心垂直连线法</h4>
                    1. 设直三棱柱高为 $h$，底面外接圆半径为 $r$。<br>
                    2. 上下底面外心分别为 $O_1, O_2$，球心 $O$ 为 $O_1O_2$ 中点。<br>
                    3. 在 Rt$\\triangle OO_1A$ 中（$A$ 为顶面顶点）：<br>
                    &nbsp;&nbsp;&nbsp;&nbsp;• 竖直分量：$OO_1 = \\frac{h}{2}$<br>
                    &nbsp;&nbsp;&nbsp;&nbsp;• 水平分量：$O_1A = r$<br>
                    4. 根据勾股定理直接求得：
                    <div class="formula-highlight">
                        $$R = \\sqrt{r^2 + \\left(\\frac{h}{2}\\right)^2}$$
                    </div>
                `
            },
            {
                id: 1, page: 1,
                name: "模型二：墙角模型 (三线垂直)",
                desc: "三条棱两两垂直，长分别为 a, b, c",
                formula: "(2R)^2 = a^2 + b^2 + c^2 \\implies R = \\frac{\\sqrt{a^2 + b^2 + c^2}}{2}",
                derivation: `
                    <h4>【原理】长方体补形法</h4>
                    1. 点击右上角<b>【补形】</b>按钮可观察空间全貌。<br>

        function drawLine(ctx, x1, y1, x2, y2, isDash = false, color = "#261d15", width = 3.5) {
            ctx.save(); ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width;

        function drawText(ctx, text, x, y, color = "#261d15", font = "bold 34px 'KaiTi', 'STKaiti', serif") {

        function drawRightAngle(ctx, ox, oy, ax, ay, bx, by, size = 18) {
            const v1x = (ax - ox), v1y = (ay - oy); const l1 = Math.hypot(v1x, v1y);
            const u1x = (v1x / l1) * size, u1y = (v1y / l1) * size;
            const v2x = (bx - ox), v2y = (by - oy); const l2 = Math.hypot(v2x, v2y);
            const u2x = (v2x / l2) * size, u2y = (v2y / l2) * size;

            ctx.save(); ctx.beginPath(); ctx.strokeStyle = "#854d0e"; ctx.lineWidth = 3;
            ctx.moveTo(ox + u1x, oy + u1y); ctx.lineTo(ox + u1x + u2x, oy + u1y + u2y); ctx.lineTo(ox + u2x, oy + u2y);
            ctx.stroke(); ctx.restore();
        }

        function createThickLine(p1, p2, radius = 0.032, color = 0x1e293b) {
            const dir = new THREE.Vector3().subVectors(p2, p1);
            const len = dir.length();
            const geo = new THREE.CylinderGeometry(radius, radius, len, 12);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.2 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(p1).addScaledVector(dir, 0.5);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
            return mesh;
        }

        function createTextSprite(text, color = '#1e293b') {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = "bold 76px 'KaiTi', serif"; ctx.fillStyle = color;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 64, 64);
            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
            sprite.scale.set(0.46, 0.46, 1);
            return sprite;
        }

        function createDottedRing(radius, plane = 'xz', color = 0x0284c7) {
            const group = new THREE.Group();
            const dotCount = 76;
            const positions = [];
            const curvePoints = [];

            for (let i = 0; i < dotCount; i++) {
                const theta = (i / dotCount) * Math.PI * 2;
                let x = 0, y = 0, z = 0;
                if (plane === 'xz') {
                    x = Math.cos(theta) * radius;
                    z = Math.sin(theta) * radius;
                } else if (plane === 'xy') {
                    x = Math.cos(theta) * radius;
                    y = Math.sin(theta) * radius;
                }
                positions.push(x, y, z);
                curvePoints.push(new THREE.Vector3(x, y, z));
            }
            curvePoints.push(curvePoints[0]);

            const pGeo = new THREE.BufferGeometry();
            pGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const pMat = new THREE.PointsMaterial({
                color: color,
                size: 0.045,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.88
            });
            group.add(new THREE.Points(pGeo, pMat));

            const lGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
            const lMat = new THREE.LineDashedMaterial({
                color: color,
                dashSize: 0.08,
                gapSize: 0.06,
                transparent: true,
                opacity: 0.65
            });
            const line = new THREE.Line(lGeo, lMat);
            line.computeLineDistances();
            group.add(line);

            return group;
        }

        function createSphereShell(radius) {
            const group = new THREE.Group();
            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 40, 32),
                new THREE.MeshStandardMaterial({
                    color: 0x38bdf8,
                    transparent: true,
                    opacity: 0.22,
                    roughness: 0.1,
                    depthWrite: false
                })
            );
            group.add(sphere);

            group.add(createDottedRing(radius, 'xz', 0x0284c7));
            group.add(createDottedRing(radius, 'xy', 0x0284c7));

            const center = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), new THREE.MeshBasicMaterial({ color: 0xdc2626 }));
            group.add(center);

            const labelO = createTextSprite("O", "#dc2626");
            labelO.position.set(0, 0.22, 0);
            group.add(labelO);

            return group;
        }

        function addVertices(group, points, color = 0xd97706) {
            points.forEach(p => {
                const dot = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 12), new THREE.MeshBasicMaterial({ color }));
                dot.position.copy(p);
                group.add(dot);
            });
        }

        function createProminentCuboid(a, b, c, usedIndices = []) {
            const cuboidGroup = new THREE.Group();
            const boxMesh = new THREE.Mesh(
                new THREE.BoxGeometry(a, b, c),
                new THREE.MeshPhysicalMaterial({
                    color: 0x38bdf8, transparent: true, opacity: 0.28,
                    roughness: 0.15, metalness: 0.1, side: THREE.DoubleSide, depthWrite: false
                })
            );
            cuboidGroup.add(boxMesh);

            const V = [
                new THREE.Vector3(-a/2, -b/2, -c/2), new THREE.Vector3( a/2, -b/2, -c/2),
                new THREE.Vector3( a/2,  b/2, -c/2), new THREE.Vector3(-a/2,  b/2, -c/2),
                new THREE.Vector3(-a/2, -b/2,  c/2), new THREE.Vector3( a/2, -b/2,  c/2),
                new THREE.Vector3( a/2,  b/2,  c/2), new THREE.Vector3(-a/2,  b/2,  c/2)
            ];

            const edgeIndices = [
                0,1, 1,2, 2,3, 3,0,
                4,5, 5,6, 6,7, 7,4,
                0,4, 1,5, 2,6, 3,7
            ];
            for (let i = 0; i < edgeIndices.length; i += 2) {
                cuboidGroup.add(createThickLine(V[edgeIndices[i]], V[edgeIndices[i+1]], 0.024, 0x0284c7));
            }

            V.forEach((pt, idx) => {
                const isTetra = usedIndices.includes(idx);
                const col = isTetra ? 0xf59e0b : 0x64748b;
                const r = isTetra ? 0.075 : 0.055;
                const sphere = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 14), new THREE.MeshBasicMaterial({ color: col }));
                sphere.position.copy(pt);
                cuboidGroup.add(sphere);
            });

            return { cuboidGroup, vertices: V };
        }

        function build3DPrism() {
            const g = new THREE.Group(); g.add(createSphereShell(1.6));
            const r = 1.25, h = 2.0; const topY = h/2, botY = -h/2; const angles = [0, 2.1, 4.2];
            const T = angles.map(a => new THREE.Vector3(Math.cos(a)*r, topY, Math.sin(a)*r));
            const B = angles.map(a => new THREE.Vector3(Math.cos(a)*r, botY, Math.sin(a)*r));
            const col = 0x0f172a;
            g.add(createThickLine(T[0], T[1], 0.03, col)); g.add(createThickLine(T[1], T[2], 0.03, col)); g.add(createThickLine(T[2], T[0], 0.03, col));
            g.add(createThickLine(B[0], B[1], 0.03, col)); g.add(createThickLine(B[1], B[2], 0.03, col)); g.add(createThickLine(B[2], B[0], 0.03, col));
            g.add(createThickLine(T[0], B[0], 0.03, col)); g.add(createThickLine(T[1], B[1], 0.03, col)); g.add(createThickLine(T[2], B[2], 0.03, col));
            addVertices(g, [...T, ...B], 0x059669); return g;
        }

        function build3DCorner() {
            const g = new THREE.Group(); const a = 1.8, b = 1.4, c = 2.0;
            g.add(createSphereShell(Math.sqrt(a*a+b*b+c*c)/2));

            const { cuboidGroup, vertices } = createProminentCuboid(a, b, c, [0, 1, 3, 4]);
            cuboidGroup.visible = false;
            g.add(cuboidGroup);
            g.userData.cuboid = cuboidGroup;

            const O = vertices[0], A = vertices[1], B = vertices[3], C = vertices[4];
            const pyr = [O, A,  O, B,  O, C,  A, B,  B, C,  C, A];
            for (let i = 0; i < pyr.length; i += 2) g.add(createThickLine(pyr[i], pyr[i+1], 0.04, 0xdc2626));
            addVertices(g, [O, A, B, C], 0xdc2626);

            const sO = createTextSprite("O", "#dc2626"); sO.position.set(O.x - 0.22, O.y - 0.22, O.z); g.add(sO);
            const sA = createTextSprite("A", "#1e293b"); sA.position.set(A.x + 0.22, A.y, A.z); g.add(sA);
            const sB = createTextSprite("B", "#1e293b"); sB.position.set(B.x, B.y + 0.22, B.z); g.add(sB);
            const sC = createTextSprite("C", "#1e293b"); sC.position.set(C.x, C.y, C.z + 0.22); g.add(sC);
            return g;
        }

        function build3DEqualEdge() {
            const g = new THREE.Group(); const a = 1.8, b = 1.5, c = 2.0;
            g.add(createSphereShell(Math.sqrt(a*a+b*b+c*c)/2));

            const { cuboidGroup, vertices } = createProminentCuboid(a, b, c, [0, 2, 5, 7]);

            const V1 = vertices[0], V2 = vertices[2], V3 = vertices[5], V4 = vertices[7];
            const tet = [V1, V2,  V1, V3,  V1, V4,  V2, V3,  V3, V4,  V4, V2];
            for (let i = 0; i < tet.length; i += 2) g.add(createThickLine(tet[i], tet[i+1], 0.042, 0xd97706));
            addVertices(g, [V1, V2, V3, V4], 0xd97706);

            const sX = createTextSprite("x", "#b45309"); sX.position.set(0, b/2 + 0.2, 0); g.add(sX);
            return g;
        }

        function build3DHypotenuse() {
            const g = new THREE.Group(); const R = 1.6; g.add(createSphereShell(R));
            const B = new THREE.Vector3(-R, 0, 0), D = new THREE.Vector3(R, 0, 0), E = new THREE.Vector3(0, R * 0.8, R * 0.6), C = new THREE.Vector3(0.4, -R * 0.7, 1.07);
            g.add(createThickLine(B, D, 0.046, 0x7c3aed));
            const edges = [B, E,  E, D,  B, C,  C, D,  E, C];
            for (let i = 0; i < edges.length; i += 2) g.add(createThickLine(edges[i], edges[i+1], 0.034, 0x2563eb));
            addVertices(g, [B, D, E, C], 0x7c3aed); return g;
        }

        function build3DVertical() {
            const g = new THREE.Group(); const R = 1.6; g.add(createSphereShell(R));
            const r = 1.3, h = 1.85; const botY = -h/2;
            const G = new THREE.Vector3(-r, botY, 0), F = new THREE.Vector3(r, botY, 0), D = new THREE.Vector3(-r, h/2, 0);
            const A = new THREE.Vector3(r * Math.cos(2.2), botY, r * Math.sin(2.2));
            const B = new THREE.Vector3(r * Math.cos(-0.8), botY, r * Math.sin(-0.8));
            const O1 = new THREE.Vector3(0, botY, 0);

            g.add(createThickLine(D, G, 0.045, 0x059669));
            g.add(createThickLine(G, F, 0.03, 0x2563eb));
            g.add(createThickLine(D, F, 0.038, 0xdc2626));
            g.add(createThickLine(new THREE.Vector3(0, 0, 0), O1, 0.03, 0xb45309));

            g.add(createThickLine(D, A, 0.032, 0x1e293b));
            g.add(createThickLine(D, B, 0.032, 0x1e293b));
            g.add(createThickLine(A, G, 0.03, 0x1e293b));
            g.add(createThickLine(G, B, 0.03, 0x1e293b));
            g.add(createThickLine(A, B, 0.03, 0x1e293b));

            addVertices(g, [D, G, F, A, B], 0x059669);
            const sD = createTextSprite("D", "#059669"); sD.position.set(-r, h/2 + 0.25, 0); g.add(sD);

            return g;
        }

        function build3DIsosceles() {
            const g = new THREE.Group(); const R = 1.6; g.add(createSphereShell(R));
            const H = 2.2; const r = Math.sqrt(2 * R * H - H * H) || 1.15;
            const botY = R - H; const J = new THREE.Vector3(0, R, 0);
            const angles = [0, 2.094, 4.188];
            const basePts = angles.map(a => new THREE.Vector3(Math.cos(a) * r, botY, Math.sin(a) * r));
            const O1 = new THREE.Vector3(0, botY, 0);

            g.add(createThickLine(J, O1, 0.04, 0xdc2626));
            basePts.forEach(pt => g.add(createThickLine(J, pt, 0.038, 0xd97706)));
            g.add(createThickLine(basePts[0], basePts[1], 0.032, 0x2563eb));
            g.add(createThickLine(basePts[1], basePts[2], 0.032, 0x2563eb));
            g.add(createThickLine(basePts[2], basePts[0], 0.032, 0x2563eb));

            addVertices(g, [J, ...basePts], 0xd97706);
            const sJ = createTextSprite("J", "#b45309"); sJ.position.set(0, R + 0.28, 0); g.add(sJ);
            return g;
        }

        function build3DDualPlane() {
            const g = new THREE.Group();
            const R = 1.6;
            g.add(createSphereShell(R));

            const y0 = -0.55;
            const z0 = 0.45;
            const x0 = Math.sqrt(R*R - y0*y0 - z0*z0);

            const A = new THREE.Vector3(-x0, y0, z0);
            const B = new THREE.Vector3( x0, y0, z0);
            const r1 = Math.sqrt(R*R - z0*z0);
            const P = new THREE.Vector3(0, r1, z0);
            const r2 = Math.sqrt(R*R - y0*y0);
            const C = new THREE.Vector3(0, y0, -r2);

            const O = new THREE.Vector3(0, 0, 0);
            const O1 = new THREE.Vector3(0, 0, z0);
            const O2 = new THREE.Vector3(0, y0, 0);
            const M = new THREE.Vector3(0, y0, z0);

            function createFacet(vA, vB, vC, color, opacity = 0.35) {
                const geom = new THREE.BufferGeometry();
                const pos = new Float32Array([
                    vA.x, vA.y, vA.z,
                    vB.x, vB.y, vB.z,
                    vC.x, vC.y, vC.z
                ]);
                geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geom.computeVertexNormals();
                const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity, depthWrite: false });
                return new THREE.Mesh(geom, mat);
            }
            g.add(createFacet(P, A, B, 0x0284c7, 0.4));
            g.add(createFacet(C, A, B, 0xf59e0b, 0.35));

            g.add(createThickLine(A, B, 0.046, 0x7c3aed));
            g.add(createThickLine(P, A, 0.038, 0x0284c7));
            g.add(createThickLine(P, B, 0.038, 0x0284c7));
            g.add(createThickLine(A, C, 0.036, 0xd97706));
            g.add(createThickLine(B, C, 0.036, 0xd97706));
            g.add(createThickLine(P, C, 0.032, 0x1e293b));

            g.add(createThickLine(O, O1, 0.03, 0xdc2626));
            g.add(createThickLine(O, O2, 0.03, 0xdc2626));
            g.add(createThickLine(O1, M, 0.024, 0x854d0e));
            g.add(createThickLine(O2, M, 0.024, 0x854d0e));

            addVertices(g, [P, A, B, C], 0x7c3aed);
            const dotO1 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), new THREE.MeshBasicMaterial({ color: 0x0284c7 }));
            dotO1.position.copy(O1); g.add(dotO1);
            const dotO2 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), new THREE.MeshBasicMaterial({ color: 0xd97706 }));
            dotO2.position.copy(O2); g.add(dotO2);
            const dotM = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), new THREE.MeshBasicMaterial({ color: 0x854d0e }));
            dotM.position.copy(M); g.add(dotM);

            const sP = createTextSprite("P", "#0284c7"); sP.position.set(P.x, P.y + 0.28, P.z); g.add(sP);
            const sA = createTextSprite("A", "#1e293b"); sA.position.set(A.x - 0.25, A.y, A.z); g.add(sA);
            const sB = createTextSprite("B", "#1e293b"); sB.position.set(B.x + 0.25, B.y, B.z); g.add(sB);
            const sC = createTextSprite("C", "#d97706"); sC.position.set(C.x, C.y - 0.25, C.z - 0.2); g.add(sC);
            const sO1 = createTextSprite("O₁", "#0284c7"); sO1.position.set(O1.x - 0.24, O1.y + 0.15, O1.z); g.add(sO1);
            const sO2 = createTextSprite("O₂", "#d97706"); sO2.position.set(O2.x + 0.24, O2.y, O2.z - 0.15); g.add(sO2);
            const sM = createTextSprite("M", "#854d0e"); sM.position.set(M.x + 0.2, M.y + 0.15, M.z); g.add(sM);

            return g;
        }

            pagesSideMat, pagesSideMat,
            coverMaterial,
            page1Mat, pagesSideMat, pagesSideMat
        ]);
        coverPivot.add(bookCover);

        // 广角透明点击层
        const coverHitBox = new THREE.Mesh(
            new THREE.PlaneGeometry(BOOK_W * 1.15, BOOK_H * 1.15),
            new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })
        );
        coverHitBox.rotation.x = -Math.PI / 2;
        coverHitBox.position.set(0, BOOK_THICK / 2 + 0.08, 0);
        bookGroup.add(coverHitBox);

        const allBuilders = [
            build3DPrism, build3DCorner, build3DEqualEdge, build3DHypotenuse,
            build3DVertical, build3DIsosceles, build3DDualPlane
        ];
        const active3DModels = allBuilders.map((builder, i) => {
            const m = builder();
            m.visible = false;
            m.userData.id = i;
            m.userData.page = MODEL_DATA[i].page;
            scene.add(m);
            return m;
        });

        const page1SlotZ = [-3.4, -1.2, 1.0, 3.2];
        const page2SlotZ = [-3.1, -0.3, 2.5];

        const clickSlots = [];
        page1SlotZ.forEach((z, i) => {
            const hit = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.7), new THREE.MeshBasicMaterial({ visible: false }));
            hit.rotation.x = -Math.PI / 2;
            hit.position.set(1.7, BOOK_THICK / 2 + 0.03, z);
            hit.userData.slotIndex = i;
            hit.userData.page = 1;
            bookGroup.add(hit);
            clickSlots.push(hit);
        });
        page2SlotZ.forEach((z, i) => {
            const hit = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 2.2), new THREE.MeshBasicMaterial({ visible: false }));
            hit.rotation.x = -Math.PI / 2;
            hit.position.set(1.7, BOOK_THICK / 2 + 0.01, z);
            hit.userData.slotIndex = i + 4;
            hit.userData.page = 2;
            bookGroup.add(hit);
            clickSlots.push(hit);
        });

        /* ========================================================
           7. 交互控制与状态管理 (支持立体图向左偏移避免遮挡)
           ======================================================== */
        let isBookOpen = false;
        let currentPageNum = 1;
        let activeModel = null;
        let isAnimating = false;
        const DEFAULT_SCALE = 1.15;
        let modelScaleFactor = DEFAULT_SCALE;
        let isAutoRotating = true;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const topText = document.getElementById('top-text');
        const scaleBadge = document.getElementById('scale-badge');
        const sidePanel = document.getElementById('side-panel');
        const panelToggleTab = document.getElementById('panel-toggle-tab');
        const paintToolbarWrapper = document.getElementById('paint-toolbar-wrapper');
        const toolbarToggleTab = document.getElementById('toolbar-toggle-tab');
        const btnToggleBox = document.getElementById('btn-toggle-box');
        const pageNavBar = document.getElementById('page-nav-bar');
        const btnNextPage = document.getElementById('btn-next-page');
        const btnPrevPage = document.getElementById('btn-prev-page');
        const btnModeOrbit = document.getElementById('btn-mode-orbit');
        const btnCloseBook = document.getElementById('btn-close-book');

        btnCloseBook.addEventListener('click', (e) => {
            e.stopPropagation();
            closeBook();
        });

        function closeBook() {
            if (isAnimating || !isBookOpen) return;
            isAnimating = true;
            topText.innerHTML = "✨ 正在合上课本...";

            const tl = gsap.timeline({
                onComplete: () => {
                    isBookOpen = false;
                    isAnimating = false;
                    currentPageNum = 1;
                    coverHitBox.visible = true;
                    btnNextPage.style.display = 'inline-block';
                    btnPrevPage.style.display = 'none';
                    btnCloseBook.style.display = 'none';
                    pageNavBar.style.display = 'none';
                    topText.innerHTML = "📖 必修二教材：轻触封面即可翻开！单指旋转观察，双指滑动页面";
                }
            });

            if (pagePivot.rotation.z > 0.1) {
                tl.to(pagePivot.rotation, { z: 0, duration: 0.8, ease: "power2.inOut" }, 0);
            }
            tl.to(coverPivot.rotation, { z: 0, duration: 1.1, ease: "power2.inOut" }, "-=0.3");
            tl.to(camera.position, { x: 0, y: 8.5, z: 15.0, duration: 1.0, ease: "power2.out" }, 0);
        }

        toolbarToggleTab.onclick = () => {
            paintToolbarWrapper.classList.toggle('collapsed');
            const isCollapsed = paintToolbarWrapper.classList.contains('collapsed');
            toolbarToggleTab.innerHTML = isCollapsed ? '▼ 展开画板与工具' : '▲ 收起工具栏';
        };

        function updateOrbitButtonState() {
            if (isAutoRotating) {
                btnModeOrbit.innerHTML = '🔄 自动旋转 (点击定格)';
            } else {
                btnModeOrbit.innerHTML = '⏸ 定格观察 (点击自转)';
            }
        }

        btnModeOrbit.onclick = () => {
            if (currentDrawMode === 'orbit') {
                isAutoRotating = !isAutoRotating;
            } else {
                switchDrawMode('orbit');
                isAutoRotating = false;
            }
            updateOrbitButtonState();
        };

        function applyModelScale(val) {
            if (!activeModel) return;
            modelScaleFactor = Math.max(0.45, Math.min(2.6, val));
            activeModel.scale.set(modelScaleFactor, modelScaleFactor, modelScaleFactor);
            scaleBadge.style.display = 'inline-block';
            scaleBadge.innerText = `模型大小: ${Math.round((modelScaleFactor / DEFAULT_SCALE) * 100)}%`;
        }

        document.getElementById('btn-zoom-in').onclick = () => applyModelScale(modelScaleFactor + 0.18);
        document.getElementById('btn-zoom-out').onclick = () => applyModelScale(modelScaleFactor - 0.18);
        document.getElementById('btn-zoom-reset').onclick = () => {
            applyModelScale(DEFAULT_SCALE);
            controls.resetPan();
        };

        panelToggleTab.onclick = () => {
            sidePanel.classList.toggle('collapsed');
            const isCollapsed = sidePanel.classList.contains('collapsed');
            panelToggleTab.innerHTML = isCollapsed ? "◀<br>展<br>开<br>推<br>导" : "▶<br>收<br>起<br>推<br>导";
        };

        btnToggleBox.onclick = () => {
            if (activeModel && activeModel.userData.cuboid) {
                const c = activeModel.userData.cuboid;
                c.visible = !c.visible;
                btnToggleBox.innerText = c.visible ? "📦 隐藏补形" : "📦 补形";
            }
        };

        function openBook() {
            if (isBookOpen) return;
            isAnimating = true;
            topText.innerHTML = "✨ 正在翻开立体教材...";

            setTimeout(() => { isAnimating = false; }, 1600);

            gsap.to(coverPivot.rotation, {
                z: Math.PI * 0.98,
                duration: 1.25,
                ease: "power2.inOut",
                onComplete: () => {
                    isBookOpen = true;
                    isAnimating = false;
                    coverHitBox.visible = false;
                    pageNavBar.style.display = 'flex';
                    btnCloseBook.style.display = 'inline-block';
                    topText.innerHTML = "🎯 单指旋转看书，双指平移画面；点击卡片长出 3D 几何实体！";
                    gsap.to(camera.position, { x: 0, y: 10, z: 9.5, duration: 1.0 });
                }
            });
        }

        btnNextPage.onclick = () => {
            if (isAnimating || currentPageNum === 2) return;
            isAnimating = true;
            topText.innerHTML = "📄 正在翻至第 2 页 (垂线/等腰/面面垂直双面定位)...";
            setTimeout(() => { isAnimating = false; }, 1400);

            gsap.to(pagePivot.rotation, {
                z: Math.PI * 0.97,
                duration: 1.1,
                ease: "power2.inOut",
                onComplete: () => {
                    currentPageNum = 2;
                    isAnimating = false;
                    btnNextPage.style.display = 'none';
                    btnPrevPage.style.display = 'inline-block';
                    topText.innerHTML = "📌 第 2 页：点击【双面定位模型】观察面面垂直三棱锥！";
                }
            });
        };

        btnPrevPage.onclick = () => {
            if (isAnimating || currentPageNum === 1) return;
            isAnimating = true;
            topText.innerHTML = "📄 正在翻回第 1 页...";
            setTimeout(() => { isAnimating = false; }, 1400);

            gsap.to(pagePivot.rotation, {
                z: 0,
                duration: 1.1,
                ease: "power2.inOut",
                onComplete: () => {
                    currentPageNum = 1;
                    isAnimating = false;
                    btnPrevPage.style.display = 'none';
                    btnNextPage.style.display = 'inline-block';
                    topText.innerHTML = "📌 第 1 页：点击任意卡片拔出 3D 几何实体！";
                }
            });
        };

        /* ⭐ 核心调整：立体模型拔出时，坐标整体往左侧移动 (x: -1.9)，相机焦点同步左移居中 */
        function sproutModel(idx) {
            isAnimating = true;
            const target = active3DModels[idx];
            activeModel = target;
            modelScaleFactor = DEFAULT_SCALE;
            const data = MODEL_DATA[idx];

            pageNavBar.style.display = 'none';
            btnCloseBook.style.display = 'none';

            const startZ = idx < 4 ? page1SlotZ[idx] : page2SlotZ[idx - 4];
            target.position.set(1.7, BOOK_NORMAL_Y + 0.15, startZ);
            target.rotation.set(0, 0, 0);
            target.visible = true;
            target.scale.set(0.04, 0.01, 0.04);

            const tl = gsap.timeline({ onComplete: () => { isAnimating = false; } });
            tl.to(target.scale, { x: 0.22, y: 1.6, z: 0.22, duration: 0.38, ease: "power2.out" });
            tl.to(target.position, { y: BOOK_NORMAL_Y + 1.25, duration: 0.38, ease: "power2.out" }, "<");
            tl.to(bookGroup.position, { y: BOOK_DOWN_Y, duration: 0.85, ease: "power2.inOut" }, "-=0.15");
            tl.to(target.scale, {
                x: modelScaleFactor, y: modelScaleFactor, z: modelScaleFactor,
                duration: 0.95, ease: "elastic.out(1.15, 0.45)"
            }, "-=0.55");

            // ⭐ 关键点：模型向左平移至 x = -1.9，远离右侧面板
            tl.to(target.position, { x: -1.9, y: 0.35, z: 1.2, duration: 0.85, ease: "power2.out" }, "<");

            // ⭐ 视角中心同步平滑过渡到立体模型处，旋转时以模型为中心，绝不挡住
            gsap.to(controls.target, {
                x: -1.8,
                y: 0.35,
                z: 0.8,
                duration: 0.85,
                ease: "power2.out"
            });

            document.getElementById('m-title').innerText = data.name;
            const dBox = document.getElementById('derivation-content');
            dBox.innerHTML = data.derivation;
            if (window.renderMathInElement) {
                renderMathInElement(dBox, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }

            sidePanel.classList.remove('collapsed');
            sidePanel.classList.add('open');
            panelToggleTab.style.display = 'block';
            panelToggleTab.innerHTML = "▶<br>收<br>起<br>推<br>导";

            paintToolbarWrapper.style.display = 'flex';
            paintToolbarWrapper.classList.remove('collapsed');
            toolbarToggleTab.innerHTML = '▲ 收起工具栏';

            topText.innerHTML = `💡 当前探究：${data.name} (Apple Pencil直接提笔即画，双指平移画面)`;
            applyModelScale(DEFAULT_SCALE);

            isAutoRotating = true;
            updateOrbitButtonState();

            if ((idx === 1 || idx === 2) && target.userData.cuboid) {
                btnToggleBox.style.display = 'inline-block';
                btnToggleBox.innerText = target.userData.cuboid.visible ? "📦 隐藏补形" : "📦 补形";
            } else {
                btnToggleBox.style.display = 'none';
            }
        }

        document.getElementById('btn-return').addEventListener('click', () => {
            if (!activeModel || isAnimating) return;
            isAnimating = true;

            sidePanel.classList.remove('open', 'collapsed');
            panelToggleTab.style.display = 'none';
            paintToolbarWrapper.style.display = 'none';
            scaleBadge.style.display = 'none';
            btnToggleBox.style.display = 'none';
            clearScreenDrawing();

            controls.resetPan(); // ⭐ 视线平滑回正到屏幕正中

            gsap.to(bookGroup.position, { y: BOOK_NORMAL_Y, duration: 0.85, ease: "power2.inOut" });

            const idx = activeModel.userData.id;
            const startZ = idx < 4 ? page1SlotZ[idx] : page2SlotZ[idx - 4];

            gsap.to(activeModel.position, { x: 1.7, y: BOOK_NORMAL_Y + 0.15, z: startZ, duration: 0.75, ease: "power3.in" });
            gsap.to(activeModel.scale, {
                x: 0.04, y: 0.01, z: 0.04,
                duration: 0.75, ease: "power2.in",
                onComplete: () => {
                    activeModel.visible = false;
                    activeModel = null;
                    isAnimating = false;
                    pageNavBar.style.display = 'flex';
                    btnCloseBook.style.display = 'inline-block';
                    switchDrawMode('orbit');
                    topText.innerHTML = "🎯 单指旋转看书，双指平移画面；点击卡片长出 3D 几何实体！";
                }
            });
        });

        function handlePointerTap(clientX, clientY) {
            if (isAnimating || currentDrawMode !== 'orbit') return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (!isBookOpen) {
                const hits = raycaster.intersectObjects([coverHitBox, bookCover, bookBase, ...bookGroup.children], true);
                if (hits.length > 0) {
                    openBook();
                }
                return;
            }

            if (isBookOpen && !activeModel) {
                const validSlots = clickSlots.filter(s => s.userData.page === currentPageNum);
                const hits = raycaster.intersectObjects(validSlots);
                if (hits.length > 0) {
                    sproutModel(hits[0].object.userData.slotIndex);
                }
            }
        }

        let tapStartX = 0, tapStartY = 0, tapStartTime = 0;
        let lastHandledTime = 0;

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#side-panel') || e.target.closest('#paint-toolbar-wrapper') || e.target.closest('#page-nav-bar') || e.target.closest('#top-left-bar')) return;
            tapStartX = e.clientX;
            tapStartY = e.clientY;
            tapStartTime = Date.now();
        }, { passive: true });

        window.addEventListener('pointerup', (e) => {
            if (e.target.closest('#side-panel') || e.target.closest('#paint-toolbar-wrapper') || e.target.closest('#page-nav-bar') || e.target.closest('#top-left-bar')) return;

            const dist = Math.hypot(e.clientX - tapStartX, e.clientY - tapStartY);
            const dt = Date.now() - tapStartTime;

            if (dist < 32 && dt < 600) {
                const now = Date.now();
                if (now - lastHandledTime > 200) {
                    lastHandledTime = now;
                    handlePointerTap(e.clientX, e.clientY);
                }
            }
        }, { passive: true });

        /* ========================================================
           8. 全屏批注画板系统
           ======================================================== */
        const drawCanvas = document.getElementById('draw-canvas');
        const drawCtx = drawCanvas.getContext('2d');

        let currentDrawMode = 'orbit';
        let currentColor = '#dc2626';
        let isDrawing = false;
        let activePointerId = null;
        let lastPos = { x: 0, y: 0 };
        let startPos = { x: 0, y: 0 };
        let lineSnapshot = null;
        let dpr = window.devicePixelRatio || 1;

        function resizeDrawCanvas() {
            dpr = window.devicePixelRatio || 1;
            const w = window.innerWidth;
            const h = window.innerHeight;

            const tempCanvas = document.createElement('canvas');
            if (drawCanvas.width > 300 && drawCanvas.height > 150) {
                tempCanvas.width = drawCanvas.width;
                tempCanvas.height = drawCanvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(drawCanvas, 0, 0);
            }

            drawCanvas.width = Math.round(w * dpr);
            drawCanvas.height = Math.round(h * dpr);
            drawCanvas.style.width = w + 'px';
            drawCanvas.style.height = h + 'px';

            drawCtx.setTransform(1, 0, 0, 1, 0, 0);
            drawCtx.scale(dpr, dpr);

            if (tempCanvas.width > 0 && tempCanvas.height > 0) {
                drawCtx.save();
                drawCtx.setTransform(1, 0, 0, 1, 0, 0);
                drawCtx.drawImage(tempCanvas, 0, 0);
                drawCtx.restore();
            }
        }
        resizeDrawCanvas();
        window.addEventListener('resize', resizeDrawCanvas);

        function clearScreenDrawing() {
            drawCtx.save();
            drawCtx.setTransform(1, 0, 0, 1, 0, 0);
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawCtx.restore();
        }
        document.getElementById('btn-clear-draw').onclick = clearScreenDrawing;

        function switchDrawMode(mode) {
            currentDrawMode = mode;
            ['btn-mode-orbit', 'btn-mode-pen', 'btn-mode-line', 'btn-mode-eraser'].forEach(id => {
                document.getElementById(id).classList.remove('active');
            });

            if (mode === 'orbit') {
                controlsEnabled = true;
                drawCanvas.classList.remove('drawing-active');
                btnModeOrbit.classList.add('active');
                updateOrbitButtonState();
            } else {
                controlsEnabled = false;
                drawCanvas.classList.add('drawing-active');
                if (mode === 'pen') document.getElementById('btn-mode-pen').classList.add('active');
                else if (mode === 'line') document.getElementById('btn-mode-line').classList.add('active');
                else if (mode === 'eraser') document.getElementById('btn-mode-eraser').classList.add('active');
            }
        }

        document.getElementById('btn-mode-pen').onclick = () => switchDrawMode('pen');
        document.getElementById('btn-mode-line').onclick = () => switchDrawMode('line');
        document.getElementById('btn-mode-eraser').onclick = () => switchDrawMode('eraser');

        document.querySelectorAll('.palette .color-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.palette .color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                currentColor = dot.dataset.color;
                if (currentDrawMode === 'eraser') switchDrawMode('pen');
            };
        });

        function getCanvasPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        drawCanvas.addEventListener('pointerdown', (e) => {
            if (currentDrawMode === 'orbit') return;
            if (isDrawing) return;

            isDrawing = true;
            activePointerId = e.pointerId;

            try {
                drawCanvas.setPointerCapture(e.pointerId);
            } catch (err) {}

            const pos = getCanvasPos(e);
            startPos = pos;
            lastPos = pos;

            if (currentDrawMode === 'line') {
                lineSnapshot = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
            } else if (currentDrawMode === 'eraser') {
                eraseAt(pos.x, pos.y);
            } else if (currentDrawMode === 'pen') {
                drawCtx.strokeStyle = currentColor;
                drawCtx.fillStyle = currentColor;
                drawCtx.lineWidth = 3.5;
                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';
                drawCtx.beginPath();
                drawCtx.arc(pos.x, pos.y, 1.75, 0, Math.PI * 2);
                drawCtx.fill();
            }

            e.preventDefault();
        });

        drawCanvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || e.pointerId !== activePointerId) return;

            const pos = getCanvasPos(e);

            if (currentDrawMode === 'pen') {
                drawCtx.strokeStyle = currentColor;
                drawCtx.lineWidth = 3.5;
                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';

                drawCtx.beginPath();
                drawCtx.moveTo(lastPos.x, lastPos.y);
                drawCtx.lineTo(pos.x, pos.y);
                drawCtx.stroke();
                lastPos = pos;
            } else if (currentDrawMode === 'line') {
                if (lineSnapshot) {
                    drawCtx.putImageData(lineSnapshot, 0, 0);
                }
                drawCtx.strokeStyle = currentColor;
                drawCtx.lineWidth = 3.5;
                drawCtx.lineCap = 'round';
                drawCtx.beginPath();
                drawCtx.moveTo(startPos.x, startPos.y);
                drawCtx.lineTo(pos.x, pos.y);
                drawCtx.stroke();
            } else if (currentDrawMode === 'eraser') {
                eraseAt(pos.x, pos.y);
            }

            e.preventDefault();
        });

        function finishDrawing(e) {
            if (!isDrawing || (e && e.pointerId !== activePointerId)) return;
            try {
                if (activePointerId !== null) {
                    drawCanvas.releasePointerCapture(activePointerId);
                }
            } catch (err) {}
            isDrawing = false;
            activePointerId = null;
            lineSnapshot = null;
        }

        drawCanvas.addEventListener('pointerup', finishDrawing);
        drawCanvas.addEventListener('pointercancel', finishDrawing);

        function eraseAt(x, y) {
            drawCtx.save();
            drawCtx.globalCompositeOperation = 'destination-out';
            drawCtx.beginPath();
            drawCtx.arc(x, y, 20, 0, Math.PI * 2);
            drawCtx.fill();
            drawCtx.restore();
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#side-panel') || e.target.closest('#paint-toolbar-wrapper') || e.target.closest('#page-nav-bar') || e.target.closest('#top-left-bar')) return;
            if (e.pointerType === 'pen' && activeModel && currentDrawMode === 'orbit') {
                switchDrawMode('pen');
            }
        });

        /* ========================================================
           9. 渲染循环
           ======================================================== */
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (activeModel && !isAnimating && currentDrawMode === 'orbit' && isAutoRotating) {
                activeModel.rotation.y += delta * 0.35;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
